services:
  play14-web:
    container_name: play14-web
    build:
      context: .
      dockerfile: packages/web/Dockerfile.dev
      target: development
      cache_from:
        - type=registry,ref=play14containerregistry.azurecr.io/play14/play14-web:dev-cache
      cache_to:
        - type=inline
    env_file:
      - ./packages/web/.env.local
    ports:
      - "3000:3000"
    volumes:
      - ./packages/web/src:/app/packages/web/src:z
      - ./packages/web/public:/app/packages/web/public:z
      - ./packages/web/next.config.js:/app/packages/web/next.config.js:z
      - ./packages/web/tsconfig.json:/app/packages/web/tsconfig.json:z
      - ./packages/web/.prettierrc:/app/packages/web/.prettierrc:z
      - ./packages/web/eslint.config.mjs:/app/packages/web/eslint.config.mjs:z
      - web-node_modules:/app/node_modules
    environment:
      - NODE_ENV=development
      - STRAPI_API_URL=http://play14-api:1337
    command: bun run develop
    networks:
      - play14-api
    depends_on:
      - play14-api
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:3000",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  play14-api:
    container_name: play14-api
    build:
      context: .
      dockerfile: packages/api/Dockerfile.dev
    image: play14-api:dev
    restart: unless-stopped
    env_file: ./packages/api/.env
    environment:
      HOST: 0.0.0.0
      DATABASE_CLIENT: ${DATABASE_CLIENT}
      DATABASE_HOST: play14-db
      DATABASE_NAME: ${DATABASE_NAME}
      DATABASE_USERNAME: ${DATABASE_USERNAME}
      DATABASE_PORT: ${DATABASE_PORT}
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      NODE_ENV: ${NODE_ENV}
      METRICS_ENABLED: ${METRICS_ENABLED:-true}
      # Redis for distributed cron locking
      REDIS_URL: redis://play14-redis:6379
    volumes:
      - ./packages/api/config:/app/packages/api/config
      - ./packages/api/src:/app/packages/api/src
      - ./packages/api/.env:/app/packages/api/.env
      - ./packages/api/public/uploads:/app/packages/api/public/uploads
    ports:
      - "1337:1337"
      - "9000:9000"
    networks:
      - play14-api
    depends_on:
      - play14-db
      - play14-redis

  play14-db:
    container_name: play14-db
    restart: unless-stopped
    env_file: ./packages/api/.env
    image: docker.io/library/postgres:17.6-alpine
    environment:
      POSTGRES_USER: ${DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}
    volumes:
      - play14-data:/var/lib/postgresql/data/
    ports:
      - "5432:5432"
    networks:
      - play14-api

  # Test database - isolated from development database
  # Used for integration tests
  play14-db-test:
    container_name: play14-db-test
    image: docker.io/library/postgres:17.6-alpine
    environment:
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_password
      POSTGRES_DB: play14_test
    ports:
      - "5433:5432"
    networks:
      - play14-api
    # No volume - data is ephemeral for tests
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test_user -d play14_test"]
      interval: 5s
      timeout: 5s
      retries: 5

  play14-redis:
    container_name: play14-redis
    image: docker.io/library/redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - play14-api
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # S3-compatible local object storage — mirrors the Cellar add-on we use in
  # Clever Cloud staging/prod. Host port 9100 (not 9000 — that collides with
  # the Strapi Prometheus metrics server on play14-api).
  play14-minio:
    container_name: play14-minio
    image: docker.io/minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9100:9000"
      - "9101:9001"
    volumes:
      - minio-data:/data
    networks:
      - play14-api

  # One-shot: creates the uploads bucket, opens it for anonymous read, and
  # seeds it from the local prod asset dump on first boot. Idempotent — it
  # skips the seed step once the bucket has any content. Blow away the
  # minio-data volume to force a re-seed.
  play14-minio-init:
    container_name: play14-minio-init
    image: docker.io/minio/mc:latest
    depends_on:
      - play14-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET: ${CELLAR_BUCKET:-play14-uploads}
    volumes:
      - /home/cpontet/repos/perso/backups/strapi-assets-prod:/import:ro,z
    entrypoint: /bin/sh
    command:
      - -c
      - |
        until mc alias set local http://play14-minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"; do
          echo "waiting for minio..."; sleep 2
        done
        mc mb --ignore-existing "local/$$MINIO_BUCKET"
        mc anonymous set download "local/$$MINIO_BUCKET"
        if [ -z "$$(mc ls "local/$$MINIO_BUCKET" 2>/dev/null | head -n1)" ]; then
          echo "seeding $$MINIO_BUCKET from /import..."
          mc mirror --overwrite /import "local/$$MINIO_BUCKET"
        else
          echo "$$MINIO_BUCKET already populated — skipping seed"
        fi
    networks:
      - play14-api
    restart: "no"

  stripe-webhook:
    container_name: stripe-webhook
    image: docker.io/stripe/stripe-cli:latest
    entrypoint: /bin/sh
    command:
      [
        "-c",
        "stripe listen --forward-to http://localhost:1337/api/webhooks/stripe --api-key $$STRIPE_SECRET_KEY",
      ]
    env_file:
      - packages/api/.env
    network_mode: host
    restart: unless-stopped

  design:
    container_name: play14-design
    build:
      context: ./packages/design
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    restart: unless-stopped

  pgadmin:
    container_name: pgadmin
    image: docker.io/dpage/pgadmin4:latest
    restart: unless-stopped
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@play14.org}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    networks:
      - play14-api
    depends_on:
      - play14-db

volumes:
  play14-data:
    external: true
  pgadmin-data:
  web-node_modules:
  minio-data:

networks:
  play14-api:
    name: Play14-api
    driver: bridge
