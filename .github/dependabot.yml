version: 2
# Bun workspaces use a single root lockfile (bun.lock). One npm entry at the
# repo root is sufficient for Dependabot to track updates across every
# workspace (packages/api, packages/web, packages/design), matching the
# behaviour documented for yarn/npm workspaces.
updates:
  # Root package dependencies (covers all Bun workspaces).
  #
  # Version updates are DISABLED here via `open-pull-requests-limit: 0`. The
  # weekly "Weekly dependency update" cloud routine now owns npm bumps end to
  # end: it bumps patch, minor and major across every package.json, runs the
  # full lint/typecheck/test/build suite, waits for the staging deploy, then
  # merges. Two independent sources of dependency PRs would only race each
  # other on bun.lock.
  #
  # The entry is kept rather than deleted because Dependabot *security*
  # updates still open PRs regardless of this limit - and they honour the
  # `ignore` rules below, which is the part worth preserving.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 0
    labels:
      - "dependencies"
      - "bun"
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
      include: "scope"
    reviewers:
      - "cpontet"
    assignees:
      - "cpontet"
    ignore:
      # Strapi 5 admin panel pins React 18 and react-router-dom 6 as peers.
      # React 19 support is still RFC (strapi/strapi#25739), so block major
      # and minor bumps until upstream lands the upgrade. Patches still flow.
      - dependency-name: "react"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
      - dependency-name: "react-dom"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
      - dependency-name: "react-router-dom"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
      - dependency-name: "styled-components"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"

  # GitHub Actions used across workflows. Left enabled: the weekly cloud
  # routine only touches package.json / bun.lock, so nothing else bumps these.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci(deps)"
      include: "scope"
    reviewers:
      - "cpontet"
    assignees:
      - "cpontet"
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
