version: 2
# Bun workspaces use a single root lockfile (bun.lock). One npm entry at the
# repo root is sufficient for Dependabot to track updates across every
# workspace (packages/api, packages/web, packages/design), matching the
# behaviour documented for yarn/npm workspaces.
updates:
  # Root package dependencies (covers all Bun workspaces)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "bun"
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
      include: "scope"
    reviewers:
      - "cpontet"
    assignees:
      - "cpontet"
    groups:
      development-dependencies:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
      production-dependencies:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Strapi 5 admin panel pins React 18 and react-router-dom 6 as peers.
      # React 19 support is still RFC (strapi/strapi#25739), so block major
      # and minor bumps until upstream lands the upgrade. Patches still flow.
      - dependency-name: "react"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
      - dependency-name: "react-dom"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
      - dependency-name: "react-router-dom"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
      - dependency-name: "styled-components"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"

  # GitHub Actions used across workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci(deps)"
      include: "scope"
    reviewers:
      - "cpontet"
    assignees:
      - "cpontet"
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
