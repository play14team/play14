name: API Production Deployment

on:
  push:
    branches: [main]
    paths:
      - "packages/api/**"
      - "!packages/api/.github/**"
  workflow_dispatch:

env:
  REGISTRY: play14containerregistry.azurecr.io
  IMAGE_NAME: play14/play14-api
  CONTAINER_APP_PROD: play14-api
  RESOURCE_GROUP: play14-community
  WORKING_DIRECTORY: packages/api

jobs:
  build-and-push:
    name: Build and Push Production Image
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: bun run tsc --noEmit

      - name: Build Strapi admin panel
        working-directory: ${{ env.WORKING_DIRECTORY }}
        env:
          NODE_ENV: production
          STRAPI_ADMIN_MAPBOX_ACCESS_TOKEN: ${{ secrets.STRAPI_ADMIN_MAPBOX_ACCESS_TOKEN }}
        run: bun run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to container registry
        run: |
          az acr login --name play14containerregistry

      - name: Build and push production container image
        uses: docker/build-push-action@v6
        with:
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          file: packages/api/Dockerfile.ci
          context: .

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Production Container App
        uses: azure/CLI@v2
        with:
          inlineScript: |
            echo "Deploying image: $REGISTRY/$IMAGE_NAME:${{ github.sha }}"
            az containerapp update \
              -n "$CONTAINER_APP_PROD" \
              -g "$RESOURCE_GROUP" \
              --image "$REGISTRY/$IMAGE_NAME:${{ github.sha }}"
