name: PR Deployment (Acceptance)

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]
    paths:
      - "packages/api/**"
      - "packages/web/**"
      - "!packages/**/.github/**"
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: "Force rebuild of all packages"
        type: boolean
        default: true

concurrency:
  group: pr-deployment-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: play14containerregistry.azurecr.io
  API_IMAGE_NAME: play14/play14-api
  WEB_IMAGE_NAME: play14/play14-web
  API_CONTAINER_APP: play14-api-acc
  WEB_CONTAINER_APP: play14-ui-acc
  RESOURCE_GROUP: play14-community

jobs:
  # ============================================================================
  # CHANGE DETECTION
  # ============================================================================
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    if: github.event.action != 'closed'
    outputs:
      api-changed: ${{ steps.result.outputs.api }}
      web-changed: ${{ steps.result.outputs.web }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Detect changed paths
        id: changes
        if: github.event_name != 'workflow_dispatch'
        uses: dorny/paths-filter@v4
        with:
          filters: |
            api:
              - 'packages/api/**'
            web:
              - 'packages/web/**'

      - name: Determine final change status
        id: result
        env:
          IS_MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
          FORCE_REBUILD: ${{ github.event_name == 'workflow_dispatch' && (inputs.force_rebuild == true || inputs.force_rebuild == '') }}
          API_CHANGED: ${{ steps.changes.outputs.api }}
          WEB_CHANGED: ${{ steps.changes.outputs.web }}
        run: |
          if [ "$IS_MANUAL" = "true" ]; then
            if [ "$FORCE_REBUILD" = "true" ]; then
              echo "Manual trigger with force rebuild - marking all packages as changed"
              echo "api=true" >> $GITHUB_OUTPUT
              echo "web=true" >> $GITHUB_OUTPUT
            else
              echo "Manual trigger without force rebuild - marking all packages as changed anyway"
              echo "api=true" >> $GITHUB_OUTPUT
              echo "web=true" >> $GITHUB_OUTPUT
            fi
          else
            echo "PR event - using detected changes"
            echo "api=$API_CHANGED" >> $GITHUB_OUTPUT
            echo "web=$WEB_CHANGED" >> $GITHUB_OUTPUT
          fi

  # ============================================================================
  # VALIDATION (single job with biome check + all tests)
  # ============================================================================
  validate:
    name: Lint, Type Check & Tests
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.api-changed == 'true' || needs.detect-changes.outputs.web-changed == 'true'
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: play14_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U test_user -d play14_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      API_CHANGED: ${{ needs.detect-changes.outputs.api-changed }}
      WEB_CHANGED: ${{ needs.detect-changes.outputs.web-changed }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      - name: Cache bun dependencies
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run biome check (lint + format)
        run: bun run check

      - name: Type check (web)
        if: env.WEB_CHANGED == 'true'
        run: bun run typecheck

      - name: Run unit tests (API + Web)
        run: bun run test

      - name: Build Strapi admin panel (for integration tests)
        if: env.API_CHANGED == 'true'
        working-directory: packages/api
        env:
          NODE_ENV: production
          STRAPI_ADMIN_MAPBOX_ACCESS_TOKEN: ${{ secrets.STRAPI_ADMIN_MAPBOX_ACCESS_TOKEN }}
        run: bun run build

      - name: Verify PostgreSQL connectivity
        if: env.API_CHANGED == 'true'
        run: |
          echo "Waiting for PostgreSQL to be ready..."
          for i in {1..30}; do
            if pg_isready -h 127.0.0.1 -p 5433 -U test_user -d play14_test; then
              echo "PostgreSQL is ready!"
              exit 0
            fi
            echo "Attempt $i/30: PostgreSQL not ready yet, waiting..."
            sleep 2
          done
          echo "PostgreSQL failed to become ready"
          exit 1

      - name: Run API integration tests
        if: env.API_CHANGED == 'true'
        working-directory: packages/api
        run: bunx vitest run -c vitest.integration.config.mts
        env:
          NODE_ENV: test
          DATABASE_HOST: 127.0.0.1
          DATABASE_PORT: 5433
          DATABASE_NAME: play14_test
          DATABASE_USERNAME: test_user
          DATABASE_PASSWORD: test_password
          ADMIN_JWT_SECRET: test-admin-jwt-secret-for-ci
          API_TOKEN_SALT: test-api-token-salt-for-ci
          TRANSFER_TOKEN_SALT: test-transfer-token-salt-for-ci
          APP_KEYS: test-app-key-1,test-app-key-2,test-app-key-3,test-app-key-4
          JWT_SECRET: test-jwt-secret-for-ci
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}

  # ============================================================================
  # API BUILD & DEPLOY (when API changed)
  # ============================================================================
  api-build-deploy:
    name: API Build & Deploy
    runs-on: ubuntu-latest
    needs: [detect-changes, validate]
    if: |
      always() &&
      github.event.action != 'closed' &&
      needs.detect-changes.outputs.api-changed == 'true' &&
      needs.validate.result == 'success'
    environment: acceptance
    env:
      COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    outputs:
      api_url: ${{ steps.get-url.outputs.url }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      - name: Cache bun dependencies
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build Strapi admin panel
        working-directory: packages/api
        env:
          NODE_ENV: production
          STRAPI_ADMIN_MAPBOX_ACCESS_TOKEN: ${{ secrets.STRAPI_ADMIN_MAPBOX_ACCESS_TOKEN }}
        run: bun run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to container registry
        run: az acr login --name play14containerregistry

      - name: Build and push container image
        uses: docker/build-push-action@v6
        with:
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.API_IMAGE_NAME }}:acc
            ${{ env.REGISTRY }}/${{ env.API_IMAGE_NAME }}:${{ env.COMMIT_SHA }}
            ${{ env.REGISTRY }}/${{ env.API_IMAGE_NAME }}:pr-${{ env.PR_NUMBER }}
            ${{ env.REGISTRY }}/${{ env.API_IMAGE_NAME }}:pr-${{ env.PR_NUMBER }}-${{ env.COMMIT_SHA }}
          file: packages/api/Dockerfile
          context: .

      - name: Deploy to Container App
        run: |
          echo "Deploying new image to container app..."
          az containerapp update \
            -n "$API_CONTAINER_APP" \
            -g "$RESOURCE_GROUP" \
            --image "$REGISTRY/$API_IMAGE_NAME:$COMMIT_SHA"

      - name: Start Container App
        env:
          SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          echo "Starting container app..."
          az rest --method post \
            --url "/subscriptions/$SUBSCRIPTION_ID/resourceGroups/$RESOURCE_GROUP/providers/Microsoft.App/containerApps/$API_CONTAINER_APP/start?api-version=2024-03-01"
          echo "Waiting 30 seconds for container app to initialize..."
          sleep 30

      - name: Wait for API to be Ready
        run: |
          echo "Waiting for API to be ready..."
          APP_URL=$(az containerapp show \
            -n "$API_CONTAINER_APP" \
            -g "$RESOURCE_GROUP" \
            --query properties.configuration.ingress.fqdn \
            -o tsv)

          if [ -z "$APP_URL" ]; then
            echo "Error: Could not retrieve container app URL"
            exit 1
          fi

          HEALTH_URL="https://$APP_URL/_health"
          MAX_ATTEMPTS=60
          SLEEP_SECONDS=10
          attempt=1

          echo "Checking health endpoint: $HEALTH_URL"
          while [ $attempt -le $MAX_ATTEMPTS ]; do
            echo "Attempt $attempt/$MAX_ATTEMPTS..."
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -m 10 "$HEALTH_URL" || echo "000")
            if [ "$HTTP_CODE" = "204" ] || [ "$HTTP_CODE" = "200" ]; then
              echo "API is ready (HTTP $HTTP_CODE)"
              exit 0
            fi
            echo "API not ready yet (HTTP $HTTP_CODE). Waiting ${SLEEP_SECONDS}s..."
            sleep $SLEEP_SECONDS
            attempt=$((attempt + 1))
          done
          echo "API failed to become ready after $MAX_ATTEMPTS attempts"
          exit 1

      - name: Get API URL
        id: get-url
        run: |
          URL=$(az containerapp show \
            -n "$API_CONTAINER_APP" \
            -g "$RESOURCE_GROUP" \
            --query properties.configuration.ingress.fqdn \
            -o tsv)
          echo "url=https://$URL" >> $GITHUB_OUTPUT

  # ============================================================================
  # API HEALTH CHECK (when API did NOT change)
  # ============================================================================
  api-health-check:
    name: API Health Check
    runs-on: ubuntu-latest
    needs: [detect-changes, validate]
    if: |
      always() &&
      github.event.action != 'closed' &&
      needs.detect-changes.outputs.api-changed != 'true' &&
      needs.detect-changes.outputs.web-changed == 'true' &&
      needs.validate.result == 'success'
    environment: acceptance
    permissions:
      id-token: write
      contents: read
    outputs:
      api_url: ${{ steps.get-url.outputs.url }}
    steps:
      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Start Container App (if stopped)
        env:
          SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          echo "Ensuring API container app is running..."
          az rest --method post \
            --url "/subscriptions/$SUBSCRIPTION_ID/resourceGroups/$RESOURCE_GROUP/providers/Microsoft.App/containerApps/$API_CONTAINER_APP/start?api-version=2024-03-01" || true
          echo "Waiting 30 seconds for container app to initialize..."
          sleep 30

      - name: Verify API is Healthy
        run: |
          echo "Verifying API is healthy..."
          APP_URL=$(az containerapp show \
            -n "$API_CONTAINER_APP" \
            -g "$RESOURCE_GROUP" \
            --query properties.configuration.ingress.fqdn \
            -o tsv)

          if [ -z "$APP_URL" ]; then
            echo "Error: Could not retrieve container app URL"
            exit 1
          fi

          HEALTH_URL="https://$APP_URL/_health"
          MAX_ATTEMPTS=60
          SLEEP_SECONDS=10
          attempt=1

          echo "Checking health endpoint: $HEALTH_URL"
          while [ $attempt -le $MAX_ATTEMPTS ]; do
            echo "Attempt $attempt/$MAX_ATTEMPTS..."
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -m 10 "$HEALTH_URL" || echo "000")
            if [ "$HTTP_CODE" = "204" ] || [ "$HTTP_CODE" = "200" ]; then
              echo "API is healthy (HTTP $HTTP_CODE)"
              exit 0
            fi
            echo "API not ready yet (HTTP $HTTP_CODE). Waiting ${SLEEP_SECONDS}s..."
            sleep $SLEEP_SECONDS
            attempt=$((attempt + 1))
          done
          echo "API health check failed after $MAX_ATTEMPTS attempts"
          exit 1

      - name: Get API URL
        id: get-url
        run: |
          URL=$(az containerapp show \
            -n "$API_CONTAINER_APP" \
            -g "$RESOURCE_GROUP" \
            --query properties.configuration.ingress.fqdn \
            -o tsv)
          echo "url=https://$URL" >> $GITHUB_OUTPUT

  # ============================================================================
  # WEB BUILD & DEPLOY (depends on API being ready)
  # ============================================================================
  web-build-deploy:
    name: Web Build & Deploy
    runs-on: ubuntu-latest
    needs: [detect-changes, validate, api-build-deploy, api-health-check]
    if: |
      always() &&
      github.event.action != 'closed' &&
      needs.detect-changes.outputs.web-changed == 'true' &&
      needs.validate.result == 'success' &&
      (needs.api-build-deploy.result == 'success' || needs.api-build-deploy.result == 'skipped') &&
      (needs.api-health-check.result == 'success' || needs.api-health-check.result == 'skipped')
    environment: acceptance
    env:
      COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    outputs:
      web_url: ${{ steps.get-url.outputs.url }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      - name: Cache bun dependencies
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Cache Next.js build
        uses: actions/cache@v5
        with:
          path: packages/web/.next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('packages/web/**/*.ts', 'packages/web/**/*.tsx', 'packages/web/**/*.js', 'packages/web/**/*.jsx') }}
          restore-keys: |
            nextjs-${{ runner.os }}-

      - name: Build Next.js
        working-directory: packages/web
        env:
          STRAPI_API_URL: ${{ vars.STRAPI_API_URL }}
          STRAPI_API_SECRET: ${{ secrets.STRAPI_API_SECRET }}
          NEXT_PUBLIC_MAPBOX_ACCESS_TOKEN: ${{ secrets.NEXT_PUBLIC_MAPBOX_ACCESS_TOKEN }}
          NEXT_PUBLIC_SITE_URL: "http://acc.play14.org"
          FEATURE_LOGIN_ENABLED: "true"
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ secrets.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: play14-web
          NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
          NEXT_PUBLIC_SENTRY_ENVIRONMENT: ${{ vars.SENTRY_ENVIRONMENT }}
        run: bun run build

      - name: Prepare Docker context for CI build
        working-directory: packages/web
        run: |
          sed -i '/^\.next$/d' .dockerignore
          sed -i '/^out$/d' .dockerignore

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to container registry
        run: az acr login --name play14containerregistry

      - name: Build and push container image
        uses: docker/build-push-action@v6
        with:
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.WEB_IMAGE_NAME }}:acc
            ${{ env.REGISTRY }}/${{ env.WEB_IMAGE_NAME }}:${{ env.COMMIT_SHA }}
            ${{ env.REGISTRY }}/${{ env.WEB_IMAGE_NAME }}:pr-${{ env.PR_NUMBER }}
            ${{ env.REGISTRY }}/${{ env.WEB_IMAGE_NAME }}:pr-${{ env.PR_NUMBER }}-${{ env.COMMIT_SHA }}
          file: packages/web/Dockerfile
          context: packages/web

      - name: Deploy to Container App
        env:
          STRAPI_API_URL: ${{ vars.STRAPI_API_URL }}
        run: |
          echo "Deploying new image to container app..."
          az containerapp update \
            -n "$WEB_CONTAINER_APP" \
            -g "$RESOURCE_GROUP" \
            --image "$REGISTRY/$WEB_IMAGE_NAME:$COMMIT_SHA" \
            --set-env-vars \
              STRAPI_API_URL="$STRAPI_API_URL" \
              STRAPI_API_SECRET=secretref:strapi-api-secret \
              NEXT_PUBLIC_MAPBOX_ACCESS_TOKEN=secretref:mapbox-token \
              NEXT_PUBLIC_SITE_URL="http://acc.play14.org" \
              FEATURE_LOGIN_ENABLED="true"

      - name: Start Container App
        env:
          SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          echo "Starting container app..."
          az rest --method post \
            --url "/subscriptions/$SUBSCRIPTION_ID/resourceGroups/$RESOURCE_GROUP/providers/Microsoft.App/containerApps/$WEB_CONTAINER_APP/start?api-version=2024-03-01"
          echo "Waiting 30 seconds for container app to initialize..."
          sleep 30

      - name: Wait for Web to be Ready
        run: |
          echo "Waiting for Web to be ready..."
          APP_URL=$(az containerapp show \
            -n "$WEB_CONTAINER_APP" \
            -g "$RESOURCE_GROUP" \
            --query properties.configuration.ingress.fqdn \
            -o tsv)

          if [ -z "$APP_URL" ]; then
            echo "Error: Could not retrieve container app URL"
            exit 1
          fi

          HEALTH_URL="https://$APP_URL/api/health"
          MAX_ATTEMPTS=60
          SLEEP_SECONDS=10
          attempt=1

          echo "Checking health endpoint: $HEALTH_URL"
          while [ $attempt -le $MAX_ATTEMPTS ]; do
            echo "Attempt $attempt/$MAX_ATTEMPTS..."
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -m 10 "$HEALTH_URL" || echo "000")
            if [ "$HTTP_CODE" = "204" ] || [ "$HTTP_CODE" = "200" ]; then
              echo "Web is ready (HTTP $HTTP_CODE)"
              exit 0
            fi
            echo "Web not ready yet (HTTP $HTTP_CODE). Waiting ${SLEEP_SECONDS}s..."
            sleep $SLEEP_SECONDS
            attempt=$((attempt + 1))
          done
          echo "Web failed to become ready after $MAX_ATTEMPTS attempts"
          exit 1

      - name: Get Web URL
        id: get-url
        run: |
          URL=$(az containerapp show \
            -n "$WEB_CONTAINER_APP" \
            -g "$RESOURCE_GROUP" \
            --query properties.configuration.ingress.fqdn \
            -o tsv)
          echo "url=https://$URL" >> $GITHUB_OUTPUT

  # ============================================================================
  # DEPLOYMENT SUMMARY (consolidated PR comment)
  # ============================================================================
  deployment-summary:
    name: Deployment Summary
    runs-on: ubuntu-latest
    needs: [detect-changes, validate, api-build-deploy, api-health-check, web-build-deploy]
    if: |
      always() &&
      github.event.action != 'closed' &&
      github.event.pull_request.number &&
      (needs.api-build-deploy.result == 'success' || needs.api-health-check.result == 'success' || needs.web-build-deploy.result == 'success')
    permissions:
      pull-requests: write
    env:
      API_CHANGED: ${{ needs.detect-changes.outputs.api-changed }}
      WEB_CHANGED: ${{ needs.detect-changes.outputs.web-changed }}
      API_BUILD_RESULT: ${{ needs.api-build-deploy.result }}
      API_HEALTH_RESULT: ${{ needs.api-health-check.result }}
      WEB_BUILD_RESULT: ${{ needs.web-build-deploy.result }}
      API_URL_FROM_BUILD: ${{ needs.api-build-deploy.outputs.api_url }}
      API_URL_FROM_HEALTH: ${{ needs.api-health-check.outputs.api_url }}
      WEB_URL: ${{ needs.web-build-deploy.outputs.web_url }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - name: Post deployment summary
        uses: actions/github-script@v7
        with:
          script: |
            const apiChanged = process.env.API_CHANGED === 'true';
            const webChanged = process.env.WEB_CHANGED === 'true';
            const apiBuildResult = process.env.API_BUILD_RESULT;
            const apiHealthResult = process.env.API_HEALTH_RESULT;
            const webBuildResult = process.env.WEB_BUILD_RESULT;

            const apiUrl = apiChanged
              ? process.env.API_URL_FROM_BUILD
              : process.env.API_URL_FROM_HEALTH;
            const webUrl = process.env.WEB_URL;
            const prNumber = process.env.PR_NUMBER;

            let apiStatus, webStatus;

            if (apiChanged && apiBuildResult === 'success') {
              apiStatus = `**Status**: Deployed\n- **Image**: \`${process.env.REGISTRY}/${process.env.API_IMAGE_NAME}:pr-${prNumber}\`\n- **URL**: ${apiUrl}`;
            } else if (!apiChanged && apiHealthResult === 'success') {
              apiStatus = `**Status**: Skipped (no changes)\n- **URL**: ${apiUrl} (existing deployment healthy)`;
            } else if (!apiChanged && apiHealthResult === 'skipped') {
              apiStatus = `**Status**: Skipped (no web changes requiring API)`;
            } else {
              apiStatus = `**Status**: Failed`;
            }

            if (webChanged && webBuildResult === 'success') {
              webStatus = `**Status**: Deployed\n- **Image**: \`${process.env.REGISTRY}/${process.env.WEB_IMAGE_NAME}:pr-${prNumber}\`\n- **URL**: ${webUrl}`;
            } else if (!webChanged) {
              webStatus = `**Status**: Skipped (no changes)`;
            } else {
              webStatus = `**Status**: Failed`;
            }

            const body = `## Deployment Summary

            ### API
            ${apiStatus}

            ### Web
            ${webStatus}

            ---
            You can now test this PR in the acceptance environment.`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

  # ============================================================================
  # STOP ACCEPTANCE ENVIRONMENT (on PR close)
  # ============================================================================
  stop-acceptance:
    name: Stop Acceptance Environment
    runs-on: ubuntu-latest
    if: github.event.action == 'closed'
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    steps:
      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Stop API Container App
        env:
          SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          echo "Stopping API container app..."
          az rest --method post \
            --url "/subscriptions/$SUBSCRIPTION_ID/resourceGroups/$RESOURCE_GROUP/providers/Microsoft.App/containerApps/$API_CONTAINER_APP/stop?api-version=2024-03-01" || true

      - name: Stop Web Container App
        env:
          SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          echo "Stopping Web container app..."
          az rest --method post \
            --url "/subscriptions/$SUBSCRIPTION_ID/resourceGroups/$RESOURCE_GROUP/providers/Microsoft.App/containerApps/$WEB_CONTAINER_APP/stop?api-version=2024-03-01" || true

      - name: Post stop notification
        uses: actions/github-script@v7
        env:
          PR_MERGED: ${{ github.event.pull_request.merged }}
        with:
          script: |
            const prStatus = process.env.PR_MERGED === 'true' ? 'merged' : 'closed';
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## Acceptance Environment Stopped

            Both API and Web container apps have been stopped to save resources.
            PR was ${prStatus}.`
            });
