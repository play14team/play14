name: Production Deployment

on:
  push:
    branches: [main]
    paths:
      - "packages/api/**"
      - "packages/web/**"
      - "!packages/**/.github/**"
  workflow_dispatch:

concurrency:
  group: production-deployment
  cancel-in-progress: false

env:
  REGISTRY: play14containerregistry.azurecr.io
  API_IMAGE_NAME: play14/play14-api
  WEB_IMAGE_NAME: play14/play14-web
  API_CONTAINER_APP: play14-api
  WEB_CONTAINER_APP: play14-ui
  RESOURCE_GROUP: play14-community

jobs:
  # ============================================================================
  # CHANGE DETECTION
  # ============================================================================
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      api-changed: ${{ steps.changes.outputs.api }}
      web-changed: ${{ steps.changes.outputs.web }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect changed paths
        uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            api:
              - 'packages/api/**'
            web:
              - 'packages/web/**'

  # ============================================================================
  # API VALIDATION JOBS (parallel, conditional)
  # ============================================================================
  api-typecheck:
    name: API Type Check
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.api-changed == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      - name: Cache bun dependencies
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        working-directory: packages/api
        run: bun run tsc --noEmit

  # ============================================================================
  # WEB VALIDATION JOBS (parallel, conditional)
  # ============================================================================
  web-lint-typecheck:
    name: Web Lint & Type Check
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.web-changed == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      - name: Cache bun dependencies
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run linter
        working-directory: packages/web
        run: bun run lint

      - name: Type check
        working-directory: packages/web
        run: bun run typecheck

  # ============================================================================
  # API BUILD & DEPLOY (when API changed)
  # ============================================================================
  api-build-deploy:
    name: API Build & Deploy
    runs-on: ubuntu-latest
    needs: [detect-changes, api-typecheck]
    if: |
      always() &&
      needs.detect-changes.outputs.api-changed == 'true' &&
      (needs.api-typecheck.result == 'success')
    environment: production
    permissions:
      id-token: write
      contents: read
    outputs:
      short_sha: ${{ steps.vars.outputs.short_sha }}
      api_url: ${{ steps.get-url.outputs.url }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      - name: Cache bun dependencies
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build Strapi admin panel
        working-directory: packages/api
        env:
          NODE_ENV: production
          STRAPI_ADMIN_MAPBOX_ACCESS_TOKEN: ${{ secrets.STRAPI_ADMIN_MAPBOX_ACCESS_TOKEN }}
        run: bun run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to container registry
        run: az acr login --name play14containerregistry

      - name: Get short commit SHA
        id: vars
        run: echo "short_sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Build and push container image
        env:
          COMMIT_SHA: ${{ github.sha }}
        uses: docker/build-push-action@v6
        with:
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.API_IMAGE_NAME }}:prod
            ${{ env.REGISTRY }}/${{ env.API_IMAGE_NAME }}:${{ steps.vars.outputs.short_sha }}
            ${{ env.REGISTRY }}/${{ env.API_IMAGE_NAME }}:${{ env.COMMIT_SHA }}
            ${{ env.REGISTRY }}/${{ env.API_IMAGE_NAME }}:latest
          file: packages/api/Dockerfile
          context: .

      - name: Deploy to Container App
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          echo "Deploying image: $REGISTRY/$API_IMAGE_NAME:$COMMIT_SHA"
          az containerapp update \
            -n "$API_CONTAINER_APP" \
            -g "$RESOURCE_GROUP" \
            --image "$REGISTRY/$API_IMAGE_NAME:$COMMIT_SHA"

      - name: Get API URL
        id: get-url
        run: |
          URL=$(az containerapp show \
            -n "$API_CONTAINER_APP" \
            -g "$RESOURCE_GROUP" \
            --query properties.configuration.ingress.fqdn \
            -o tsv)
          echo "url=https://$URL" >> $GITHUB_OUTPUT

      - name: Wait for deployment to stabilize
        run: |
          echo "Waiting 30 seconds for deployment to stabilize..."
          sleep 30

      - name: Health check
        env:
          API_URL: ${{ steps.get-url.outputs.url }}
        run: |
          HEALTH_URL="$API_URL/_health"
          MAX_ATTEMPTS=10
          SLEEP_SECONDS=10
          attempt=1

          echo "Checking health endpoint: $HEALTH_URL"
          while [ $attempt -le $MAX_ATTEMPTS ]; do
            echo "Attempt $attempt/$MAX_ATTEMPTS..."
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -m 10 "$HEALTH_URL" || echo "000")
            if [ "$HTTP_CODE" = "204" ] || [ "$HTTP_CODE" = "200" ]; then
              echo "API health check passed (HTTP $HTTP_CODE)"
              exit 0
            fi
            echo "Health check failed (HTTP $HTTP_CODE). Waiting ${SLEEP_SECONDS}s..."
            sleep $SLEEP_SECONDS
            attempt=$((attempt + 1))
          done
          echo "API health check failed after $MAX_ATTEMPTS attempts"
          exit 1

  # ============================================================================
  # API HEALTH CHECK (when API did NOT change)
  # ============================================================================
  api-health-check:
    name: API Health Check
    runs-on: ubuntu-latest
    needs: [detect-changes]
    if: |
      needs.detect-changes.outputs.api-changed != 'true' &&
      needs.detect-changes.outputs.web-changed == 'true'
    environment: production
    permissions:
      id-token: write
      contents: read
    outputs:
      api_url: ${{ steps.get-url.outputs.url }}
    steps:
      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Get API URL
        id: get-url
        run: |
          URL=$(az containerapp show \
            -n "$API_CONTAINER_APP" \
            -g "$RESOURCE_GROUP" \
            --query properties.configuration.ingress.fqdn \
            -o tsv)
          echo "url=https://$URL" >> $GITHUB_OUTPUT

      - name: Verify API is Healthy
        env:
          API_URL: ${{ steps.get-url.outputs.url }}
        run: |
          echo "Verifying API is healthy..."
          HEALTH_URL="$API_URL/_health"
          MAX_ATTEMPTS=10
          SLEEP_SECONDS=10
          attempt=1

          echo "Checking health endpoint: $HEALTH_URL"
          while [ $attempt -le $MAX_ATTEMPTS ]; do
            echo "Attempt $attempt/$MAX_ATTEMPTS..."
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -m 10 "$HEALTH_URL" || echo "000")
            if [ "$HTTP_CODE" = "204" ] || [ "$HTTP_CODE" = "200" ]; then
              echo "API is healthy (HTTP $HTTP_CODE)"
              exit 0
            fi
            echo "API not ready yet (HTTP $HTTP_CODE). Waiting ${SLEEP_SECONDS}s..."
            sleep $SLEEP_SECONDS
            attempt=$((attempt + 1))
          done
          echo "API health check failed after $MAX_ATTEMPTS attempts"
          exit 1

  # ============================================================================
  # WEB BUILD & DEPLOY (depends on API being ready)
  # ============================================================================
  web-build-deploy:
    name: Web Build & Deploy
    runs-on: ubuntu-latest
    needs: [detect-changes, web-lint-typecheck, api-build-deploy, api-health-check]
    if: |
      always() &&
      needs.detect-changes.outputs.web-changed == 'true' &&
      (needs.web-lint-typecheck.result == 'success') &&
      (needs.api-build-deploy.result == 'success' || needs.api-build-deploy.result == 'skipped') &&
      (needs.api-health-check.result == 'success' || needs.api-health-check.result == 'skipped')
    environment: production
    permissions:
      id-token: write
      contents: read
    outputs:
      short_sha: ${{ steps.vars.outputs.short_sha }}
      web_url: ${{ steps.get-url.outputs.url }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      - name: Cache bun dependencies
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Cache Next.js build
        uses: actions/cache@v5
        with:
          path: packages/web/.next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('packages/web/**/*.ts', 'packages/web/**/*.tsx', 'packages/web/**/*.js', 'packages/web/**/*.jsx') }}
          restore-keys: |
            nextjs-${{ runner.os }}-

      - name: Build Next.js
        working-directory: packages/web
        env:
          STRAPI_API_URL: ${{ vars.STRAPI_API_URL }}
          STRAPI_API_SECRET: ${{ secrets.STRAPI_API_SECRET }}
          NEXT_PUBLIC_MAPBOX_ACCESS_TOKEN: ${{ secrets.NEXT_PUBLIC_MAPBOX_ACCESS_TOKEN }}
          NEXT_PUBLIC_SITE_URL: "https://play14.org"
          FEATURE_LOGIN_ENABLED: "false"
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: play14-web
          NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
          NEXT_PUBLIC_SENTRY_ENVIRONMENT: ${{ vars.SENTRY_ENVIRONMENT }}
        run: bun run build

      - name: Prepare Docker context for CI build
        working-directory: packages/web
        run: |
          sed -i '/^\.next$/d' .dockerignore
          sed -i '/^out$/d' .dockerignore

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to container registry
        run: az acr login --name play14containerregistry

      - name: Get short commit SHA
        id: vars
        run: echo "short_sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Build and push container image
        env:
          COMMIT_SHA: ${{ github.sha }}
        uses: docker/build-push-action@v6
        with:
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.WEB_IMAGE_NAME }}:prod
            ${{ env.REGISTRY }}/${{ env.WEB_IMAGE_NAME }}:${{ steps.vars.outputs.short_sha }}
            ${{ env.REGISTRY }}/${{ env.WEB_IMAGE_NAME }}:${{ env.COMMIT_SHA }}
            ${{ env.REGISTRY }}/${{ env.WEB_IMAGE_NAME }}:latest
          file: packages/web/Dockerfile
          context: packages/web

      - name: Deploy to Container App
        env:
          STRAPI_API_URL: ${{ vars.STRAPI_API_URL }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          echo "Deploying image: $REGISTRY/$WEB_IMAGE_NAME:$COMMIT_SHA"
          az containerapp update \
            -n "$WEB_CONTAINER_APP" \
            -g "$RESOURCE_GROUP" \
            --image "$REGISTRY/$WEB_IMAGE_NAME:$COMMIT_SHA" \
            --set-env-vars \
              STRAPI_API_URL="$STRAPI_API_URL" \
              STRAPI_API_SECRET=secretref:strapi-api-secret \
              NEXT_PUBLIC_MAPBOX_ACCESS_TOKEN=secretref:mapbox-token \
              NEXT_PUBLIC_SITE_URL="https://play14.org"

      - name: Get Web URL
        id: get-url
        run: |
          URL=$(az containerapp show \
            -n "$WEB_CONTAINER_APP" \
            -g "$RESOURCE_GROUP" \
            --query properties.configuration.ingress.fqdn \
            -o tsv)
          echo "url=https://$URL" >> $GITHUB_OUTPUT

      - name: Wait for deployment to stabilize
        run: |
          echo "Waiting 30 seconds for deployment to stabilize..."
          sleep 30

      - name: Health check
        env:
          WEB_URL: ${{ steps.get-url.outputs.url }}
        run: |
          HEALTH_URL="$WEB_URL/api/health"
          MAX_ATTEMPTS=10
          SLEEP_SECONDS=10
          attempt=1

          echo "Checking health endpoint: $HEALTH_URL"
          while [ $attempt -le $MAX_ATTEMPTS ]; do
            echo "Attempt $attempt/$MAX_ATTEMPTS..."
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -m 10 "$HEALTH_URL" || echo "000")
            if [ "$HTTP_CODE" = "204" ] || [ "$HTTP_CODE" = "200" ]; then
              echo "Web health check passed (HTTP $HTTP_CODE)"
              exit 0
            fi
            echo "Health check failed (HTTP $HTTP_CODE). Waiting ${SLEEP_SECONDS}s..."
            sleep $SLEEP_SECONDS
            attempt=$((attempt + 1))
          done
          echo "Web health check failed after $MAX_ATTEMPTS attempts"
          exit 1

  # ============================================================================
  # DEPLOYMENT SUMMARY
  # ============================================================================
  deployment-summary:
    name: Deployment Summary
    runs-on: ubuntu-latest
    needs: [detect-changes, api-build-deploy, api-health-check, web-build-deploy]
    if: always()
    env:
      API_CHANGED: ${{ needs.detect-changes.outputs.api-changed }}
      WEB_CHANGED: ${{ needs.detect-changes.outputs.web-changed }}
      API_BUILD_RESULT: ${{ needs.api-build-deploy.result }}
      API_HEALTH_RESULT: ${{ needs.api-health-check.result }}
      WEB_BUILD_RESULT: ${{ needs.web-build-deploy.result }}
      API_URL_FROM_BUILD: ${{ needs.api-build-deploy.outputs.api_url }}
      API_URL_FROM_HEALTH: ${{ needs.api-health-check.outputs.api_url }}
      WEB_URL: ${{ needs.web-build-deploy.outputs.web_url }}
      COMMIT_SHA: ${{ github.sha }}
    steps:
      - name: Create deployment summary
        run: |
          echo "## Production Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### API" >> $GITHUB_STEP_SUMMARY
          if [ "$API_CHANGED" = "true" ] && [ "$API_BUILD_RESULT" = "success" ]; then
            echo "- **Status**: Deployed" >> $GITHUB_STEP_SUMMARY
            echo "- **Image**: \`$REGISTRY/$API_IMAGE_NAME:$COMMIT_SHA\`" >> $GITHUB_STEP_SUMMARY
            echo "- **URL**: $API_URL_FROM_BUILD" >> $GITHUB_STEP_SUMMARY
          elif [ "$API_CHANGED" != "true" ] && [ "$API_HEALTH_RESULT" = "success" ]; then
            echo "- **Status**: Skipped (no changes)" >> $GITHUB_STEP_SUMMARY
            echo "- **URL**: $API_URL_FROM_HEALTH (existing deployment healthy)" >> $GITHUB_STEP_SUMMARY
          elif [ "$API_CHANGED" != "true" ] && [ "$API_HEALTH_RESULT" = "skipped" ]; then
            echo "- **Status**: Skipped (no web changes requiring API)" >> $GITHUB_STEP_SUMMARY
          else
            echo "- **Status**: Failed" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### Web" >> $GITHUB_STEP_SUMMARY
          if [ "$WEB_CHANGED" = "true" ] && [ "$WEB_BUILD_RESULT" = "success" ]; then
            echo "- **Status**: Deployed" >> $GITHUB_STEP_SUMMARY
            echo "- **Image**: \`$REGISTRY/$WEB_IMAGE_NAME:$COMMIT_SHA\`" >> $GITHUB_STEP_SUMMARY
            echo "- **URL**: $WEB_URL" >> $GITHUB_STEP_SUMMARY
          elif [ "$WEB_CHANGED" != "true" ]; then
            echo "- **Status**: Skipped (no changes)" >> $GITHUB_STEP_SUMMARY
          else
            echo "- **Status**: Failed" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "**Commit**: $COMMIT_SHA" >> $GITHUB_STEP_SUMMARY
