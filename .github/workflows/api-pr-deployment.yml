name: API Acceptance Deployment (PR)

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]
    paths:
      - "packages/api/**"
      - "!packages/api/.github/**"

env:
  REGISTRY: play14containerregistry.azurecr.io
  IMAGE_NAME: play14/play14-api
  CONTAINER_APP_ACC: play14-api-acc
  RESOURCE_GROUP: play14-community
  WORKING_DIRECTORY: packages/api

jobs:
  build-and-push:
    name: Build, Test and Push Image
    runs-on: ubuntu-latest
    if: github.event.action != 'closed'
    environment: acceptance
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    outputs:
      short_sha: ${{ steps.vars.outputs.short_sha }}

    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: play14_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U test_user -d play14_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      - name: Cache bun dependencies
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: bun run tsc --noEmit

      - name: Run unit tests
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: bun run test

      - name: Build Strapi admin panel
        working-directory: ${{ env.WORKING_DIRECTORY }}
        env:
          NODE_ENV: production
          STRAPI_ADMIN_MAPBOX_ACCESS_TOKEN: ${{ secrets.STRAPI_ADMIN_MAPBOX_ACCESS_TOKEN }}
        run: bun run build

      - name: Verify PostgreSQL connectivity
        run: |
          echo "Waiting for PostgreSQL to be ready..."
          for i in {1..30}; do
            if pg_isready -h 127.0.0.1 -p 5433 -U test_user -d play14_test; then
              echo "PostgreSQL is ready!"
              exit 0
            fi
            echo "Attempt $i/30: PostgreSQL not ready yet, waiting..."
            sleep 2
          done
          echo "PostgreSQL failed to become ready"
          exit 1

      - name: Run integration tests
        working-directory: ${{ env.WORKING_DIRECTORY }}
        env:
          NODE_ENV: test
          DATABASE_HOST: 127.0.0.1
          DATABASE_PORT: 5433
          DATABASE_NAME: play14_test
          DATABASE_USERNAME: test_user
          DATABASE_PASSWORD: test_password
          ADMIN_JWT_SECRET: test-admin-jwt-secret-for-ci
          API_TOKEN_SALT: test-api-token-salt-for-ci
          TRANSFER_TOKEN_SALT: test-transfer-token-salt-for-ci
          APP_KEYS: test-app-key-1,test-app-key-2,test-app-key-3,test-app-key-4
          JWT_SECRET: test-jwt-secret-for-ci
        run: bun run vitest run -c vitest.integration.config.mts

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to container registry
        run: |
          az acr login --name play14containerregistry

      - name: Get short commit SHA
        id: vars
        run: echo "short_sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Build and push PR container image
        uses: docker/build-push-action@v6
        with:
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:acc
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.short_sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:pr-${{ github.event.pull_request.number }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:pr-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          file: packages/api/Dockerfile
          context: .

      - name: Comment PR with image tags
        if: github.event.pull_request.number
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🐳 **API Docker Image Built Successfully**\n\nPR Image Tags:\n- \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:pr-${{ github.event.pull_request.number }}\`\n- \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:pr-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}\`\n\n⏳ Deploying to acceptance environment...`
            })

  deploy-pr:
    name: Deploy to Acceptance
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event.action != 'closed'
    permissions:
      id-token: write
      contents: read
      pull-requests: write

    steps:
      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Acceptance Container App
        uses: azure/CLI@v2
        with:
          inlineScript: |
            echo "Deploying new image to container app (even if stopped)..."
            az containerapp update \
              -n "$CONTAINER_APP_ACC" \
              -g "$RESOURCE_GROUP" \
              --image "$REGISTRY/$IMAGE_NAME:${{ needs.build-and-push.outputs.short_sha }}"

      - name: Start Container App
        uses: azure/CLI@v2
        with:
          inlineScript: |
            echo "Starting container app..."
            az rest --method post \
              --url "/subscriptions/${{ secrets.AZURE_SUBSCRIPTION_ID }}/resourceGroups/$RESOURCE_GROUP/providers/Microsoft.App/containerApps/$CONTAINER_APP_ACC/start?api-version=2024-03-01"

            echo "Waiting 30 seconds for container app to initialize..."
            sleep 30

      - name: Wait for Container App to be Ready
        uses: azure/CLI@v2
        with:
          inlineScript: |
            echo "Waiting for container app to be ready..."

            APP_URL=$(az containerapp show \
              -n "$CONTAINER_APP_ACC" \
              -g "$RESOURCE_GROUP" \
              --query properties.configuration.ingress.fqdn \
              -o tsv)

            if [ -z "$APP_URL" ]; then
              echo "Error: Could not retrieve container app URL"
              exit 1
            fi

            HEALTH_URL="https://$APP_URL/_health"
            MAX_ATTEMPTS=60
            SLEEP_SECONDS=10
            attempt=1

            echo "Checking health endpoint: $HEALTH_URL"
            echo "Will retry up to $MAX_ATTEMPTS times (${SLEEP_SECONDS}s intervals, ~$((MAX_ATTEMPTS * SLEEP_SECONDS / 60)) minutes total)"

            while [ $attempt -le $MAX_ATTEMPTS ]; do
              echo "Attempt $attempt/$MAX_ATTEMPTS..."

              HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -m 10 "$HEALTH_URL" || echo "000")

              if [ "$HTTP_CODE" = "204" ] || [ "$HTTP_CODE" = "200" ]; then
                echo "✅ Container app is ready (HTTP $HTTP_CODE)"
                exit 0
              fi

              echo "Container app not ready yet (HTTP $HTTP_CODE). Waiting ${SLEEP_SECONDS}s..."
              sleep $SLEEP_SECONDS
              attempt=$((attempt + 1))
            done

            echo "❌ Container app failed to become ready after $MAX_ATTEMPTS attempts"
            exit 1

      - name: Get Container App URL
        id: get-url
        uses: azure/CLI@v2
        with:
          inlineScript: |
            URL=$(az containerapp show \
              -n "$CONTAINER_APP_ACC" \
              -g "$RESOURCE_GROUP" \
              --query properties.configuration.ingress.fqdn \
              -o tsv)
            echo "url=https://$URL" >> $GITHUB_OUTPUT

      - name: Comment PR with deployment info
        if: github.event.pull_request.number
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `✅ **API Deployed to Acceptance Environment**\n\n🌐 URL: ${{ steps.get-url.outputs.url }}\n📦 Image: \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.build-and-push.outputs.short_sha }}\`\n\nYou can now test this PR in the acceptance environment.`
            })

  stop-pr:
    name: Stop Acceptance Environment
    runs-on: ubuntu-latest
    if: github.event.action == 'closed'
    permissions:
      id-token: write
      contents: read
      pull-requests: write

    steps:
      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Stop Container App
        uses: azure/CLI@v2
        with:
          inlineScript: |
            echo "Stopping container app..."
            az rest --method post \
              --url "/subscriptions/${{ secrets.AZURE_SUBSCRIPTION_ID }}/resourceGroups/$RESOURCE_GROUP/providers/Microsoft.App/containerApps/$CONTAINER_APP_ACC/stop?api-version=2024-03-01"

      - name: Comment PR with stop notification
        uses: actions/github-script@v7
        with:
          script: |
            const prStatus = context.payload.pull_request.merged ? 'merged' : 'closed';
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🛑 **API Acceptance Environment Stopped**\n\nThe container app has been stopped to save resources.\nPR was ${prStatus}.`
            })
