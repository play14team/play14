name: Clever Cloud — Deploy production (api + web)

on:
  push:
    branches: [main]
    paths:
      - "packages/api/**"
      - "packages/web/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/clever-deploy-production.yml"
      - "!packages/**/.github/**"
  workflow_dispatch:

permissions:
  contents: write # required to push `deployed/api` and `deployed/web` tags

concurrency:
  group: clever-deploy-production
  cancel-in-progress: false

jobs:
  lint:
    name: Lint and typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun lint

      - name: Typecheck API
        run: bun --cwd packages/api typecheck

      - name: Typecheck Web
        run: bun --cwd packages/web typecheck

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test API
        run: bun --filter play14-api test

      - name: Test Web
        run: bun --filter play14-web test

  detect-changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.changes.outputs.api }}
      web: ${{ steps.changes.outputs.web }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      # Compare the current commit against the `deployed/<service>` tag that
      # points at the last commit we successfully shipped for that service.
      # This ensures changes stranded on `main` by a previously-failed run are
      # still detected on the next push. A missing tag (fresh repo, service
      # never deployed through this workflow) falls back to "deploy it".
      - name: Detect changes vs last successful deploy
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          needs_deploy() {
            local service="$1"
            local path="$2"
            local tag="deployed/${service}"

            if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
              echo "manual dispatch → ${service}=true" >&2
              echo "true"
              return
            fi

            if ! git rev-parse --verify --quiet "refs/tags/${tag}" >/dev/null 2>&1; then
              echo "tag ${tag} missing → ${service}=true (bootstrap)" >&2
              echo "true"
              return
            fi

            if git diff --name-only "refs/tags/${tag}" "$HEAD_SHA" -- "${path}" | grep -q .; then
              echo "changes under ${path} since ${tag} → ${service}=true" >&2
              echo "true"
            else
              echo "no changes under ${path} since ${tag} → ${service}=false" >&2
              echo "false"
            fi
          }

          api=$(needs_deploy api packages/api)
          web=$(needs_deploy web packages/web)

          {
            echo "api=${api}"
            echo "web=${web}"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### Change detection"
            echo "- api: **${api}**"
            echo "- web: **${web}**"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-api:
    name: Deploy play14-api
    needs: [lint, test, detect-changes]
    if: needs.detect-changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install clever-tools
        run: npm install -g clever-tools@3

      - name: Authenticate with Clever Cloud
        env:
          CLEVER_TOKEN: ${{ secrets.CLEVER_TOKEN }}
          CLEVER_SECRET: ${{ secrets.CLEVER_SECRET }}
        run: clever login --token "$CLEVER_TOKEN" --secret "$CLEVER_SECRET"

      - name: Link Clever Cloud app
        env:
          CC_API_APP_ID: ${{ secrets.CC_API_APP_ID }}
        run: clever link --alias play14-api "$CC_API_APP_ID"

      - name: Deploy
        run: clever deploy --alias play14-api --force --same-commit-policy rebuild

      - name: Mark commit as deployed (api)
        env:
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git tag -f deployed/api "$HEAD_SHA"
          git push origin -f "refs/tags/deployed/api"

  deploy-web:
    name: Deploy play14-web
    needs: [lint, test, detect-changes, deploy-api]
    # Web waits for API (generateStaticParams needs the API at build time).
    # If the API job was skipped (no API changes), the web still runs.
    # If the API job failed, the web is blocked.
    if: ${{ always() && needs.lint.result == 'success' && needs.test.result == 'success' && needs.detect-changes.outputs.web == 'true' && needs.deploy-api.result != 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install clever-tools
        run: npm install -g clever-tools@3

      - name: Authenticate with Clever Cloud
        env:
          CLEVER_TOKEN: ${{ secrets.CLEVER_TOKEN }}
          CLEVER_SECRET: ${{ secrets.CLEVER_SECRET }}
        run: clever login --token "$CLEVER_TOKEN" --secret "$CLEVER_SECRET"

      - name: Link Clever Cloud app
        env:
          CC_WEB_APP_ID: ${{ secrets.CC_WEB_APP_ID }}
        run: clever link --alias play14-web "$CC_WEB_APP_ID"

      - name: Deploy
        run: clever deploy --alias play14-web --force --same-commit-policy rebuild

      - name: Mark commit as deployed (web)
        env:
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git tag -f deployed/web "$HEAD_SHA"
          git push origin -f "refs/tags/deployed/web"
