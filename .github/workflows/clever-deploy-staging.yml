name: Clever Cloud — Deploy staging (api + web)

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]
    paths:
      - "packages/api/**"
      - "packages/web/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/clever-deploy-staging.yml"
      - "!packages/**/.github/**"
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: clever-deploy-staging
  cancel-in-progress: false

jobs:
  # --- Stop staging apps when PR is merged ------------------------------------
  stop-staging:
    name: Stop staging apps
    if: github.event_name == 'pull_request' && github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Install clever-tools
        run: npm install -g clever-tools@3

      - name: Authenticate with Clever Cloud
        env:
          CLEVER_TOKEN: ${{ secrets.CLEVER_TOKEN }}
          CLEVER_SECRET: ${{ secrets.CLEVER_SECRET }}
        run: clever login --token "$CLEVER_TOKEN" --secret "$CLEVER_SECRET"

      - name: Stop staging API
        env:
          CC_API_STAGING_APP_ID: ${{ secrets.CC_API_STAGING_APP_ID }}
        run: |
          clever link --alias play14-api-staging "$CC_API_STAGING_APP_ID"
          clever stop --alias play14-api-staging || echo "::warning::clever stop failed for play14-api-staging"

      - name: Stop staging Web
        env:
          CC_WEB_STAGING_APP_ID: ${{ secrets.CC_WEB_STAGING_APP_ID }}
        run: |
          clever link --alias play14-web-staging "$CC_WEB_STAGING_APP_ID"
          clever stop --alias play14-web-staging || echo "::warning::clever stop failed for play14-web-staging"

      - name: Deactivate GitHub Deployments
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for ENV in staging-api staging-web; do
            DEPLOYMENT_IDS=$(gh api \
              -H "Accept: application/vnd.github+json" \
              "/repos/${{ github.repository }}/deployments?environment=$ENV&per_page=100" \
              --jq '.[].id')
            for ID in $DEPLOYMENT_IDS; do
              gh api \
                --method POST \
                -H "Accept: application/vnd.github+json" \
                "/repos/${{ github.repository }}/deployments/$ID/statuses" \
                -f state=inactive >/dev/null \
                || echo "::warning::failed to deactivate deployment $ID ($ENV)"
            done
          done

  # --- Lint and typecheck on PR open/update ------------------------------------
  lint:
    name: Lint and typecheck
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun lint

      - name: Typecheck API
        run: bun --cwd packages/api typecheck

      - name: Typecheck Web
        run: bun --cwd packages/web typecheck

  # --- Unit tests on PR open/update -------------------------------------------
  test:
    name: Unit tests
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test API
        run: bun --filter play14-api test

      - name: Test Web
        run: bun --filter play14-web test

  # --- Deploy staging apps on PR open/update ----------------------------------
  # Both apps redeploy on every PR push. The previous per-package change
  # detection skipped the API when only web changed, which is wrong on staging
  # because `stop-staging` (above) stops both apps when a PR is merged — a
  # later web-only PR would then build against an offline staging API.
  deploy-api-staging:
    name: Deploy play14-api-staging
    needs: [lint, test]
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      STAGING_URL: https://api-staging.play14.org
      DEPLOY_REF: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref || github.ref }}
          fetch-depth: 0

      - name: Install clever-tools
        run: npm install -g clever-tools@3

      - name: Authenticate with Clever Cloud
        env:
          CLEVER_TOKEN: ${{ secrets.CLEVER_TOKEN }}
          CLEVER_SECRET: ${{ secrets.CLEVER_SECRET }}
        run: clever login --token "$CLEVER_TOKEN" --secret "$CLEVER_SECRET"

      - name: Link Clever Cloud staging app
        env:
          CC_API_STAGING_APP_ID: ${{ secrets.CC_API_STAGING_APP_ID }}
        run: clever link --alias play14-api-staging "$CC_API_STAGING_APP_ID"

      - name: Create GitHub Deployment (in progress)
        id: deployment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DEPLOYMENT_ID=$(jq -nc \
              --arg ref "$DEPLOY_REF" \
              '{ref: $ref, environment: "staging-api", description: "play14-api-staging", auto_merge: false, transient_environment: true, production_environment: false, required_contexts: []}' \
            | gh api \
              --method POST \
              -H "Accept: application/vnd.github+json" \
              "/repos/${{ github.repository }}/deployments" \
              --input - \
              --jq .id)
          echo "id=$DEPLOYMENT_ID" >> "$GITHUB_OUTPUT"
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            "/repos/${{ github.repository }}/deployments/$DEPLOYMENT_ID/statuses" \
            -f state=in_progress \
            -f "environment_url=$STAGING_URL" \
            -f "log_url=https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Deploy
        run: clever deploy --alias play14-api-staging --force --same-commit-policy rebuild

      - name: Mark deployment success
        if: success() && steps.deployment.outputs.id != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            "/repos/${{ github.repository }}/deployments/${{ steps.deployment.outputs.id }}/statuses" \
            -f state=success \
            -f "environment_url=$STAGING_URL" \
            -f "log_url=https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Mark deployment failure
        if: failure() && steps.deployment.outputs.id != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            "/repos/${{ github.repository }}/deployments/${{ steps.deployment.outputs.id }}/statuses" \
            -f state=failure \
            -f "log_url=https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  deploy-web-staging:
    name: Deploy play14-web-staging
    needs: [lint, test, deploy-api-staging]
    # Web depends on API: `next build` fetches data from the staging API, so
    # we wait until the API redeploy succeeds before building the web app.
    if: ${{ github.event.action != 'closed' && needs.deploy-api-staging.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      STAGING_URL: https://staging.play14.org
      DEPLOY_REF: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref || github.ref }}
          fetch-depth: 0

      - name: Install clever-tools
        run: npm install -g clever-tools@3

      - name: Authenticate with Clever Cloud
        env:
          CLEVER_TOKEN: ${{ secrets.CLEVER_TOKEN }}
          CLEVER_SECRET: ${{ secrets.CLEVER_SECRET }}
        run: clever login --token "$CLEVER_TOKEN" --secret "$CLEVER_SECRET"

      - name: Link Clever Cloud staging app
        env:
          CC_WEB_STAGING_APP_ID: ${{ secrets.CC_WEB_STAGING_APP_ID }}
        run: clever link --alias play14-web-staging "$CC_WEB_STAGING_APP_ID"

      - name: Create GitHub Deployment (in progress)
        id: deployment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DEPLOYMENT_ID=$(jq -nc \
              --arg ref "$DEPLOY_REF" \
              '{ref: $ref, environment: "staging-web", description: "play14-web-staging", auto_merge: false, transient_environment: true, production_environment: false, required_contexts: []}' \
            | gh api \
              --method POST \
              -H "Accept: application/vnd.github+json" \
              "/repos/${{ github.repository }}/deployments" \
              --input - \
              --jq .id)
          echo "id=$DEPLOYMENT_ID" >> "$GITHUB_OUTPUT"
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            "/repos/${{ github.repository }}/deployments/$DEPLOYMENT_ID/statuses" \
            -f state=in_progress \
            -f "environment_url=$STAGING_URL" \
            -f "log_url=https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Deploy
        run: clever deploy --alias play14-web-staging --force --same-commit-policy rebuild

      - name: Mark deployment success
        if: success() && steps.deployment.outputs.id != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            "/repos/${{ github.repository }}/deployments/${{ steps.deployment.outputs.id }}/statuses" \
            -f state=success \
            -f "environment_url=$STAGING_URL" \
            -f "log_url=https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Mark deployment failure
        if: failure() && steps.deployment.outputs.id != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            "/repos/${{ github.repository }}/deployments/${{ steps.deployment.outputs.id }}/statuses" \
            -f state=failure \
            -f "log_url=https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
