name: Clever Cloud — Deploy API (production)

on:
  push:
    branches: [main]
    paths:
      - "packages/api/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/clever-deploy-api.yml"
      - "!packages/api/.github/**"
  workflow_dispatch:

concurrency:
  group: clever-deploy-api-prod
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy play14-api to Clever Cloud
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          # clever-tools needs the git history to push to the Clever Cloud remote.
          fetch-depth: 0

      - name: Install clever-tools
        run: npm install -g clever-tools

      - name: Authenticate with Clever Cloud
        env:
          CLEVER_TOKEN: ${{ secrets.CLEVER_TOKEN }}
          CLEVER_SECRET: ${{ secrets.CLEVER_SECRET }}
        run: clever login --token "$CLEVER_TOKEN" --secret "$CLEVER_SECRET"

      - name: Link Clever Cloud app
        env:
          CC_API_APP_ID: ${{ secrets.CC_API_APP_ID }}
        # Re-linking each run avoids needing .clever.json committed and keeps app IDs out of git.
        run: clever link --alias play14-api "$CC_API_APP_ID"

      - name: Deploy
        # --force tolerates non-fast-forward pushes (e.g. rebased main).
        run: clever deploy --alias play14-api --force
