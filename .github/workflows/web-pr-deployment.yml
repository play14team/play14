name: Web Acceptance Deployment (PR)

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]
    paths:
      - "packages/web/**"
      - "!packages/web/.github/**"
  workflow_dispatch:

concurrency:
  group: web-acceptance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"
  REGISTRY: play14containerregistry.azurecr.io
  IMAGE_NAME: play14/play14-web
  CONTAINER_APP_ACC: play14-ui-acc
  RESOURCE_GROUP: play14-community
  WORKING_DIRECTORY: packages/web

jobs:
  build-and-push:
    name: Build, Test and Push Image
    runs-on: ubuntu-latest
    if: github.event.action != 'closed'
    environment: acceptance
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    outputs:
      short_sha: ${{ steps.vars.outputs.short_sha }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      - name: Cache bun dependencies
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run linter
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: bun run lint

      - name: Type check
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: bun run typecheck

      - name: Run tests
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: bun run test

      - name: Cache Next.js build
        uses: actions/cache@v5
        with:
          path: packages/web/.next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('packages/web/**/*.ts', 'packages/web/**/*.tsx', 'packages/web/**/*.js', 'packages/web/**/*.jsx') }}
          restore-keys: |
            nextjs-${{ runner.os }}-

      - name: Build Next.js
        working-directory: ${{ env.WORKING_DIRECTORY }}
        env:
          STRAPI_API_URL: ${{ vars.STRAPI_API_URL }}
          STRAPI_API_SECRET: ${{ secrets.STRAPI_API_SECRET }}
          NEXT_PUBLIC_MAPBOX_ACCESS_TOKEN: ${{ secrets.NEXT_PUBLIC_MAPBOX_ACCESS_TOKEN }}
          NEXT_PUBLIC_SITE_URL: "http://acc.play14.org"
          FEATURE_LOGIN_ENABLED: "true"
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ secrets.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: play14-web
          NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
          NEXT_PUBLIC_SENTRY_ENVIRONMENT: ${{ vars.SENTRY_ENVIRONMENT }}
        run: bun run build

      - name: Prepare Docker context for CI build
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: |
          # Remove .next from .dockerignore for CI builds (we need the pre-built output)
          sed -i '/^\.next$/d' .dockerignore
          sed -i '/^out$/d' .dockerignore

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to container registry
        run: |
          az acr login --name play14containerregistry

      - name: Get short commit SHA
        id: vars
        run: echo "short_sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Build and push container image
        uses: docker/build-push-action@v6
        with:
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:acc
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.short_sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:pr-${{ github.event.pull_request.number }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:pr-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          file: packages/web/Dockerfile
          context: packages/web

      - name: Comment PR with image tags
        if: github.event.pull_request.number
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🐳 **Web Docker Image Built Successfully**\n\nPR Image Tags:\n- \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:pr-${{ github.event.pull_request.number }}\`\n- \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:pr-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}\`\n\n⏳ Deploying to acceptance environment...`
            })

  deploy-pr:
    name: Deploy to Acceptance
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event.action != 'closed'
    environment: acceptance
    permissions:
      id-token: write
      contents: read
      pull-requests: write

    steps:
      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Acceptance Container App
        uses: azure/CLI@v2
        with:
          inlineScript: |
            echo "Deploying new image to container app..."
            az containerapp update \
              -n "$CONTAINER_APP_ACC" \
              -g "$RESOURCE_GROUP" \
              --image "$REGISTRY/$IMAGE_NAME:${{ needs.build-and-push.outputs.short_sha }}" \
              --set-env-vars \
                STRAPI_API_URL="${{ vars.STRAPI_API_URL }}" \
                STRAPI_API_SECRET=secretref:strapi-api-secret \
                NEXT_PUBLIC_MAPBOX_ACCESS_TOKEN=secretref:mapbox-token \
                NEXT_PUBLIC_SITE_URL="http://acc.play14.org" \
                FEATURE_LOGIN_ENABLED="true"

      - name: Start Container App
        uses: azure/CLI@v2
        with:
          inlineScript: |
            echo "Starting container app..."
            az rest --method post \
              --url "/subscriptions/${{ secrets.AZURE_SUBSCRIPTION_ID }}/resourceGroups/$RESOURCE_GROUP/providers/Microsoft.App/containerApps/$CONTAINER_APP_ACC/start?api-version=2024-03-01"

            echo "Waiting 30 seconds for container app to initialize..."
            sleep 30

      - name: Wait for Container App to be Ready
        uses: azure/CLI@v2
        with:
          inlineScript: |
            echo "Waiting for container app to be ready..."

            APP_URL=$(az containerapp show \
              -n "$CONTAINER_APP_ACC" \
              -g "$RESOURCE_GROUP" \
              --query properties.configuration.ingress.fqdn \
              -o tsv)

            if [ -z "$APP_URL" ]; then
              echo "Error: Could not retrieve container app URL"
              exit 1
            fi

            HEALTH_URL="https://$APP_URL/api/health"
            MAX_ATTEMPTS=60
            SLEEP_SECONDS=10
            attempt=1

            echo "Checking health endpoint: $HEALTH_URL"
            echo "Will retry up to $MAX_ATTEMPTS times (${SLEEP_SECONDS}s intervals)"

            while [ $attempt -le $MAX_ATTEMPTS ]; do
              echo "Attempt $attempt/$MAX_ATTEMPTS..."

              HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -m 10 "$HEALTH_URL" || echo "000")

              if [ "$HTTP_CODE" = "204" ] || [ "$HTTP_CODE" = "200" ]; then
                echo "✅ Container app is ready (HTTP $HTTP_CODE)"
                exit 0
              fi

              echo "Container app not ready yet (HTTP $HTTP_CODE). Waiting ${SLEEP_SECONDS}s..."
              sleep $SLEEP_SECONDS
              attempt=$((attempt + 1))
            done

            echo "❌ Container app failed to become ready after $MAX_ATTEMPTS attempts"
            exit 1

      - name: Get Container App URL
        id: get-url
        uses: azure/CLI@v2
        with:
          inlineScript: |
            URL=$(az containerapp show \
              -n "$CONTAINER_APP_ACC" \
              -g "$RESOURCE_GROUP" \
              --query properties.configuration.ingress.fqdn \
              -o tsv)
            echo "url=https://$URL" >> $GITHUB_OUTPUT

      - name: Comment PR with deployment info
        if: github.event.pull_request.number
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `✅ **Web Deployed to Acceptance Environment**\n\n🌐 URL: ${{ steps.get-url.outputs.url }}\n📦 Image: \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.build-and-push.outputs.short_sha }}\`\n🔗 Backend: ${{ vars.STRAPI_API_URL }}\n\nYou can now test this PR in the acceptance environment.`
            })

  stop-pr:
    name: Stop Acceptance Environment
    runs-on: ubuntu-latest
    if: github.event.action == 'closed'
    permissions:
      id-token: write
      contents: read
      pull-requests: write

    steps:
      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Stop Container App
        uses: azure/CLI@v2
        with:
          inlineScript: |
            echo "Stopping container app..."
            az rest --method post \
              --url "/subscriptions/${{ secrets.AZURE_SUBSCRIPTION_ID }}/resourceGroups/$RESOURCE_GROUP/providers/Microsoft.App/containerApps/$CONTAINER_APP_ACC/stop?api-version=2024-03-01"

      - name: Comment PR with stop notification
        uses: actions/github-script@v7
        with:
          script: |
            const prStatus = context.payload.pull_request.merged ? 'merged' : 'closed';
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🛑 **Web Acceptance Environment Stopped**\n\nThe container app has been stopped to save resources.\nPR was ${prStatus}.`
            })
