name: Security scan

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  # Gitleaks action posts a summary and annotations on PRs.
  pull-requests: read

concurrency:
  group: security-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # --- Gitleaks: scan history / PR diff for committed secrets ----------------
  gitleaks:
    name: Gitleaks secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          # Full history is needed so gitleaks can scan the PR diff range.
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Required for GitHub organisation repos (this repo lives under the
          # play14team org). The secret is set at the repository level in
          # GitHub settings - Secrets and variables - Actions.
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "true"
          GITLEAKS_ENABLE_SUMMARY: "true"
          # Fail the job on any finding (default behaviour of the action — we
          # pin it explicitly so accidental future changes don't silently
          # downgrade this gate).
          GITLEAKS_EXIT_CODE: "1"

  # --- bun audit: known vulnerability check on runtime deps ------------------
  bun-audit:
    name: Bun audit (prod deps)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Bun
        # Matches the pin used by the deploy workflows (oven-sh/setup-bun@v2
        # with no explicit version input → installs the latest Bun, which
        # the root package.json pins to 1.3.5 via packageManager).
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run bun audit on production dependencies
        # `bun audit` ships in Bun 1.2.x+ (present in 1.3.5). Scans the root
        # lockfile, which covers every workspace (api, web, design).
        # `--prod` excludes devDependencies. `--audit-level=high` fails the
        # job only on high/critical advisories — low/moderate still surface
        # in the log but don't block PRs.
        # Advisories with a clean, non-breaking fix are pinned to patched
        # versions via root `overrides` (shell-quote, tmp, linkify-it,
        # form-data) rather than ignored here.
        #
        # Ignored advisories (each needs a major bump of a Strapi-internal
        # transitive dep with no safe override; tracked for an upstream Strapi
        # bump):
        #   GHSA-r5fr-rjxr-66jc — lodash `_.template` code injection. The only
        #   fix bun's DB accepts is lodash >=4.17.24, an unofficial republish;
        #   lodash maintainers have not tagged past 4.17.21. We pin canonical
        #   4.17.21 via `overrides`; our code never calls `_.template`.
        #   GHSA-p6gq-j5cr-w38f — nodemailer raw-option file read / SSRF. Only
        #   reached via @strapi/provider-email-sendmail, which this app does
        #   not use (a custom strapi-provider-email-sender is configured).
        #   GHSA-fx2h-pf6j-xcff — vite `server.fs.deny` bypass on Windows. Vite
        #   5.x is the Strapi admin builder; this is a dev-server-only,
        #   Windows-only path, irrelevant to our built admin on a Linux runtime.
        #   GHSA-vmh5-mc38-953g / GHSA-vxpw-j846-p89q / GHSA-hm92-r4w5-c3mj —
        #   undici SOCKS5/WebSocket issues. The vulnerable 7.25 line is a Strapi
        #   internal; we don't use undici SOCKS5 proxying or its WS client.
        #   GHSA-96hv-2xvq-fx4p — ws fragment-flood DoS. Reached only via a
        #   Strapi-internal ws@7 consumer; bumping to 8.x breaks it.
        #   GHSA-23hp-3jrh-7fpw — node-tar decompression/parse DoS. The whole
        #   published line (<=7.5.18) is flagged, so there is no patched version
        #   to override to; reached only via @strapi/strapi, its documentation
        #   plugin and strapi-plugin-config-sync (server-side archive handling).
        #   GHSA-gcfj-64vw-6mp9 — axios inherited-proxy-after-config-clone. Fix
        #   is axios >=1.18.0, but bumping the existing `^1.15.2` override forces
        #   a full re-resolve that floats unrelated transitives (parse5 → 8) under
        #   the pinned-bun mismatch, against this repo's controlled-bump policy.
        #   Reached only via Strapi-internal plugins; we set no untrusted proxy.
        #   GHSA-xcpc-8h2w-3j85 — adm-zip crafted-ZIP 4GB allocation. Vulnerable
        #   range is <0.6.0 and 0.6.0 is unreleased, so no override target; pulled
        #   only by strapi-plugin-config-sync's server-side config import.
        #   GHSA-3jxr-9vmj-r5cp — brace-expansion {} expansion DoS. Two major
        #   lines coexist in the tree (minimatch@3 needs v1, others v2), so no
        #   single-version override is safe; all consumers are Strapi-internal.
        #   GHSA-52cp-r559-cp3m — js-yaml merge-key quadratic CPU. The 3.x line
        #   tops out at 3.14.1 with no fix; only js-yaml 4.x patches it, a
        #   breaking bump of a @strapi/utils-internal dep.
        run: >
          bun audit --prod --audit-level=high
          --ignore=GHSA-r5fr-rjxr-66jc
          --ignore=GHSA-p6gq-j5cr-w38f
          --ignore=GHSA-fx2h-pf6j-xcff
          --ignore=GHSA-vmh5-mc38-953g
          --ignore=GHSA-vxpw-j846-p89q
          --ignore=GHSA-hm92-r4w5-c3mj
          --ignore=GHSA-96hv-2xvq-fx4p
          --ignore=GHSA-23hp-3jrh-7fpw
          --ignore=GHSA-gcfj-64vw-6mp9
          --ignore=GHSA-xcpc-8h2w-3j85
          --ignore=GHSA-3jxr-9vmj-r5cp
          --ignore=GHSA-52cp-r559-cp3m
