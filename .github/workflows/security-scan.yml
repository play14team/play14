name: Security scan

on:
  pull_request:
    # `edited` is here so retargeting a PR onto main runs the scan. Without it
    # a PR opened against another branch and later rebased onto main never
    # emits an event this workflow listens for: the `opened` event was filtered
    # out by `branches: [main]`, and a base change emits only `edited`.
    #
    # `edited` also fires on every title and body change, so each job is gated
    # on `github.event.changes.base` to keep description edits from re-running
    # the scan. The other three types are GitHub's default set, respelled here
    # because naming any type replaces the default rather than adding to it.
    types: [opened, synchronize, reopened, edited]
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  # Gitleaks action posts a summary and annotations on PRs.
  pull-requests: read

concurrency:
  # The event action is part of the group so the runs `edited` produces —
  # which the jobs below skip unless the base branch changed — cannot cancel a
  # real `synchronize` run. Without it, editing a PR's title or description
  # while its scan is still running kills that scan and leaves only a skipped
  # run behind, so the head commit ends up never actually scanned. Concurrency
  # is evaluated before any job-level `if`, so it has to be handled here.
  # Successive pushes still cancel each other: they share the action.
  group: security-scan-${{ github.ref }}-${{ github.event.action }}
  cancel-in-progress: true

jobs:
  # --- Gitleaks: scan history / PR diff for committed secrets ----------------
  gitleaks:
    name: Gitleaks secret scan
    # Skip PR description edits; run when the base branch changed.
    if: github.event.action != 'edited' || github.event.changes.base != null
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          # Full history is needed so gitleaks can scan the PR diff range.
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Required for GitHub organisation repos (this repo lives under the
          # play14team org). The secret is set at the repository level in
          # GitHub settings - Secrets and variables - Actions.
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "true"
          GITLEAKS_ENABLE_SUMMARY: "true"
          # Fail the job on any finding (default behaviour of the action — we
          # pin it explicitly so accidental future changes don't silently
          # downgrade this gate).
          GITLEAKS_EXIT_CODE: "1"

  # --- bun audit: known vulnerability check on runtime deps ------------------
  bun-audit:
    name: Bun audit (prod deps)
    # Skip PR description edits; run when the base branch changed.
    if: github.event.action != 'edited' || github.event.changes.base != null
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Bun
        # Matches the pin used by the deploy workflows (oven-sh/setup-bun@v2
        # with no explicit version input → installs the latest Bun, which
        # the root package.json pins to 1.3.5 via packageManager).
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run bun audit on production dependencies
        # `bun audit` ships in Bun 1.2.x+ (present in 1.3.5). Scans the root
        # lockfile, which covers every workspace (api, web, design).
        # `--prod` excludes devDependencies. `--audit-level=high` fails the
        # job only on high/critical advisories — low/moderate still surface
        # in the log but don't block PRs.
        # Advisories with a clean, non-breaking fix are pinned to patched
        # versions via root `overrides` (shell-quote, tmp, linkify-it,
        # form-data, fast-uri, ip-address, nanoid, postcss, sharp,
        # brace-expansion, axios, lodash/lodash-es, browserslist, js-yaml,
        # nodemailer, adm-zip, http-cache-semantics) rather than ignored here.
        # undici can't take a flat override (6.x, 7.x and 8.x are all in the
        # tree), so its 7.x and 8.x lockfile entries were re-resolved in place
        # to patched versions within their consumers' ranges (7.30.0, 8.11.2).
        #
        # Ignored advisories (each needs a major bump of a Strapi-internal
        # transitive dep with no safe override, or has no published fix;
        # tracked for an upstream Strapi bump). Re-check this list after any
        # dependency bump and drop the entries an override has since fixed —
        # `bun audit` says nothing about an ignore that no longer matches, so
        # dead entries accumulate silently and hide the live ones:
        #   GHSA-fx2h-pf6j-xcff — vite `server.fs.deny` bypass on Windows. Vite
        #   5.x is the Strapi admin builder; this is a dev-server-only,
        #   Windows-only path, irrelevant to our built admin on a Linux runtime.
        #   GHSA-g84c-rxfj-3j2c — webpack-dev-middleware path traversal. Fix is
        #   >=7.4.5, but @strapi/strapi pins 6.1.3 exactly. It only runs inside
        #   `strapi develop`'s admin dev server; production serves the admin
        #   pre-built by `strapi build` and never loads it.
        #   GHSA-vfj7-8cjw-p6xm — braces stack exhaustion on deeply nested
        #   patterns. No patched release exists (3.0.3 is the latest). Pulled
        #   via micromatch/chokidar in Strapi's tooling and sass; it only ever
        #   expands glob patterns from our own code and config, never input.
        #
        # Dropped here because an override or bump has since fixed them, and a
        # stale ignore would mask a future advisory on the same package:
        #   GHSA-vmh5-mc38-953g / GHSA-vxpw-j846-p89q / GHSA-hm92-r4w5-c3mj /
        #   GHSA-4cwx-7wf7-3272 — undici. The 7.x and 8.x copies are now on
        #   patched versions (7.30.0, 8.11.2) and the advisories no longer match.
        #   GHSA-xcpc-8h2w-3j85 — adm-zip. 0.6.1 is now published, so the
        #   `adm-zip` override has a target and the advisory no longer matches.
        #   GHSA-w3rx-r6r6-pgpr / GHSA-5p2g-fcmc-qvqq — image-size ICNS/JXL/HEIF
        #   parser loops. Fixed upstream in 2.0.3; we are on 2.0.4. The
        #   magic-byte allowlist TODO these carried is now moot.
        run: >
          bun audit --prod --audit-level=high
          --ignore=GHSA-fx2h-pf6j-xcff
          --ignore=GHSA-g84c-rxfj-3j2c
          --ignore=GHSA-vfj7-8cjw-p6xm
