name: Security scan

on:
  pull_request:
    # `edited` is here so retargeting a PR onto main runs the scan. Without it
    # a PR opened against another branch and later rebased onto main never
    # emits an event this workflow listens for: the `opened` event was filtered
    # out by `branches: [main]`, and a base change emits only `edited`.
    #
    # `edited` also fires on every title and body change, so each job is gated
    # on `github.event.changes.base` to keep description edits from re-running
    # the scan. The other three types are GitHub's default set, respelled here
    # because naming any type replaces the default rather than adding to it.
    types: [opened, synchronize, reopened, edited]
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  # Gitleaks action posts a summary and annotations on PRs.
  pull-requests: read

concurrency:
  group: security-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # --- Gitleaks: scan history / PR diff for committed secrets ----------------
  gitleaks:
    name: Gitleaks secret scan
    # Skip PR description edits; run when the base branch changed.
    if: github.event.action != 'edited' || github.event.changes.base != null
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          # Full history is needed so gitleaks can scan the PR diff range.
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Required for GitHub organisation repos (this repo lives under the
          # play14team org). The secret is set at the repository level in
          # GitHub settings - Secrets and variables - Actions.
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "true"
          GITLEAKS_ENABLE_SUMMARY: "true"
          # Fail the job on any finding (default behaviour of the action — we
          # pin it explicitly so accidental future changes don't silently
          # downgrade this gate).
          GITLEAKS_EXIT_CODE: "1"

  # --- bun audit: known vulnerability check on runtime deps ------------------
  bun-audit:
    name: Bun audit (prod deps)
    # Skip PR description edits; run when the base branch changed.
    if: github.event.action != 'edited' || github.event.changes.base != null
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Bun
        # Matches the pin used by the deploy workflows (oven-sh/setup-bun@v2
        # with no explicit version input → installs the latest Bun, which
        # the root package.json pins to 1.3.5 via packageManager).
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run bun audit on production dependencies
        # `bun audit` ships in Bun 1.2.x+ (present in 1.3.5). Scans the root
        # lockfile, which covers every workspace (api, web, design).
        # `--prod` excludes devDependencies. `--audit-level=high` fails the
        # job only on high/critical advisories — low/moderate still surface
        # in the log but don't block PRs.
        # Advisories with a clean, non-breaking fix are pinned to patched
        # versions via root `overrides` (shell-quote, tmp, linkify-it,
        # form-data, fast-uri, ip-address, nanoid, postcss, sharp,
        # brace-expansion, axios, lodash/lodash-es) rather than ignored here.
        #
        # Ignored advisories (each needs a major bump of a Strapi-internal
        # transitive dep with no safe override, or has no published fix;
        # tracked for an upstream Strapi bump). Re-check this list after any
        # dependency bump and drop the entries an override has since fixed —
        # `bun audit` says nothing about an ignore that no longer matches, so
        # dead entries accumulate silently and hide the live ones:
        #   GHSA-fx2h-pf6j-xcff — vite `server.fs.deny` bypass on Windows. Vite
        #   5.x is the Strapi admin builder; this is a dev-server-only,
        #   Windows-only path, irrelevant to our built admin on a Linux runtime.
        #   GHSA-vmh5-mc38-953g / GHSA-vxpw-j846-p89q — undici SOCKS5/WebSocket
        #   issues. The vulnerable line is a Strapi internal; we don't use
        #   undici SOCKS5 proxying or its WS client.
        #   GHSA-hm92-r4w5-c3mj — undici. Same reasoning as above.
        #   GHSA-4cwx-7wf7-3272 — undici cross-user disclosure via degenerate
        #   private cache directives. Fix is undici >=7.29.0, but @strapi/core
        #   pins undici to an exact 6.28.0 (outside the advisory range), so a
        #   flat override would force Strapi's HTTP client across a major.
        #   The flagged 7.x copy is pulled by cheerio, which we use for HTML
        #   parsing only; it never issues HTTP requests, so undici's
        #   response-cache path is unreachable. (isomorphic-dompurify → jsdom 30
        #   now resolves undici 8.x, outside the advisory range entirely.)
        #   GHSA-xcpc-8h2w-3j85 — adm-zip crafted-ZIP 4GB allocation. Vulnerable
        #   range is <0.6.0 and 0.6.0 is unreleased, so no override target; pulled
        #   only by strapi-plugin-config-sync's server-side config import.
        #   GHSA-w3rx-r6r6-pgpr / GHSA-5p2g-fcmc-qvqq — image-size infinite loops
        #   in the ICNS, JXL and HEIF parsers. No fix exists: the whole published
        #   line (<=2.0.2) is flagged and 2.0.2 is latest. We call `imageSize` on
        #   uploaded logo bytes in the custom venue/sponsor/event controllers, so
        #   the parsers are reachable — but only over authenticated `/admin/*`
        #   routes, limiting the blast radius to a DoS triggered by an already
        #   trusted host user. TODO: gate `imageSize` behind a magic-byte
        #   allowlist (PNG/JPEG/WebP/GIF) so the vulnerable parsers are never
        #   entered, then drop these two ignores.
        run: >
          bun audit --prod --audit-level=high
          --ignore=GHSA-fx2h-pf6j-xcff
          --ignore=GHSA-vmh5-mc38-953g
          --ignore=GHSA-vxpw-j846-p89q
          --ignore=GHSA-hm92-r4w5-c3mj
          --ignore=GHSA-4cwx-7wf7-3272
          --ignore=GHSA-xcpc-8h2w-3j85
          --ignore=GHSA-w3rx-r6r6-pgpr
          --ignore=GHSA-5p2g-fcmc-qvqq
