name: Web Production Deployment

on:
  push:
    branches: [main]
    paths:
      - "packages/web/**"
      - "!packages/web/.github/**"
  workflow_dispatch:

concurrency:
  group: web-production
  cancel-in-progress: false

env:
  NODE_VERSION: "20"
  STRAPI_API_URL: "https://community.play14.org"
  REGISTRY: play14containerregistry.azurecr.io
  IMAGE_NAME: play14/play14-web
  CONTAINER_APP_NAME: play14-web
  RESOURCE_GROUP: play14-community
  WORKING_DIRECTORY: packages/web

jobs:
  check-pr-merge:
    name: Check if PR was merged
    runs-on: ubuntu-latest
    outputs:
      pr_number: ${{ steps.check.outputs.pr_number }}
      pr_head_sha: ${{ steps.check.outputs.pr_head_sha }}
      is_pr_merge: ${{ steps.check.outputs.is_pr_merge }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Check if commit is from PR merge
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          COMMIT_MSG=$(git log -1 --pretty=%B)
          echo "Commit message: $COMMIT_MSG"

          PR_NUMBER=$(echo "$COMMIT_MSG" | grep -oP 'Merge pull request #\K\d+' || echo "$COMMIT_MSG" | grep -oP '\(#\K\d+(?=\))' || echo "")

          if [ -n "$PR_NUMBER" ] && [[ "$PR_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "✅ Detected PR merge: #$PR_NUMBER"
            echo "pr_number=$PR_NUMBER" >> $GITHUB_OUTPUT

            echo "Fetching PR details from GitHub API..."

            if PR_DATA=$(gh api "repos/${{ github.repository }}/pulls/${PR_NUMBER}" 2>&1); then
              PR_HEAD_SHA=$(echo "$PR_DATA" | jq -r '.head.sha')

              if [ -n "$PR_HEAD_SHA" ] && [ "$PR_HEAD_SHA" != "null" ]; then
                echo "✅ Retrieved PR head SHA: $PR_HEAD_SHA"
                echo "pr_head_sha=$PR_HEAD_SHA" >> $GITHUB_OUTPUT
                echo "is_pr_merge=true" >> $GITHUB_OUTPUT
              else
                echo "⚠️ Could not extract PR head SHA"
                echo "is_pr_merge=false" >> $GITHUB_OUTPUT
              fi
            else
              echo "⚠️ GitHub API call failed: $PR_DATA"
              echo "is_pr_merge=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "ℹ️ No PR number found - direct push to main"
            echo "is_pr_merge=false" >> $GITHUB_OUTPUT
          fi

  retag-pr-image:
    name: Retag PR Image for Production
    runs-on: ubuntu-latest
    needs: check-pr-merge
    if: needs.check-pr-merge.outputs.is_pr_merge == 'true'
    outputs:
      image_retagged: ${{ steps.retag.outputs.success }}
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to container registry
        run: |
          az acr login --name play14containerregistry

      - name: Retag PR image for production
        id: retag
        continue-on-error: true
        env:
          PR_NUMBER: ${{ needs.check-pr-merge.outputs.pr_number }}
          PR_HEAD_SHA: ${{ needs.check-pr-merge.outputs.pr_head_sha }}
        run: |
          set +e

          PR_IMAGE="$REGISTRY/$IMAGE_NAME:pr-${PR_NUMBER}-${PR_HEAD_SHA}"
          PROD_MERGE_SHA_IMAGE="$REGISTRY/$IMAGE_NAME:${{ github.sha }}"
          PROD_HEAD_SHA_IMAGE="$REGISTRY/$IMAGE_NAME:${PR_HEAD_SHA}"
          PROD_LATEST_IMAGE="$REGISTRY/$IMAGE_NAME:latest"

          echo "Looking for PR image: $PR_IMAGE"

          if az acr repository show-tags --name play14containerregistry --repository "$IMAGE_NAME" --output json | grep -q "pr-${PR_NUMBER}-${PR_HEAD_SHA}"; then
            echo "✅ PR image found in registry"

            echo "Pulling PR image: $PR_IMAGE"
            RETRY=0
            MAX_RETRIES=3
            until docker pull "$PR_IMAGE" || [ $RETRY -eq $MAX_RETRIES ]; do
              RETRY=$((RETRY + 1))
              echo "Pull attempt $RETRY failed. Retrying in 5 seconds..."
              sleep 5
            done

            if [ $RETRY -eq $MAX_RETRIES ]; then
              echo "❌ Failed to pull PR image after $MAX_RETRIES attempts"
              echo "success=false" >> $GITHUB_OUTPUT
              exit 1
            fi

            docker tag "$PR_IMAGE" "$PROD_MERGE_SHA_IMAGE"
            docker tag "$PR_IMAGE" "$PROD_HEAD_SHA_IMAGE"
            docker tag "$PR_IMAGE" "$PROD_LATEST_IMAGE"

            echo "Pushing production tags..."
            PUSH_FAILED=false

            if ! docker push "$PROD_MERGE_SHA_IMAGE"; then
              echo "⚠️ Failed to push merge SHA tag"
              PUSH_FAILED=true
            fi

            if ! docker push "$PROD_HEAD_SHA_IMAGE"; then
              echo "⚠️ Failed to push head SHA tag"
              PUSH_FAILED=true
            fi

            if ! docker push "$PROD_LATEST_IMAGE"; then
              echo "⚠️ Failed to push latest tag"
              PUSH_FAILED=true
            fi

            if [ "$PUSH_FAILED" = true ]; then
              echo "❌ Some tags failed to push"
              echo "success=false" >> $GITHUB_OUTPUT
              exit 1
            fi

            echo "✅ Successfully retagged PR image for production"
            echo "success=true" >> $GITHUB_OUTPUT
            exit 0
          else
            echo "⚠️ PR image not found in registry: $PR_IMAGE"
            echo "success=false" >> $GITHUB_OUTPUT
            exit 1
          fi

  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    needs: [check-pr-merge, retag-pr-image]
    if: |
      always() && (
        needs.check-pr-merge.outputs.is_pr_merge == 'false' ||
        (needs.check-pr-merge.outputs.is_pr_merge == 'true' && needs.retag-pr-image.outputs.image_retagged != 'true')
      )
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIRECTORY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run linter
        run: bun run lint

      - name: Type check
        run: bun run typecheck

  build-production:
    name: Build Production Image
    runs-on: ubuntu-latest
    needs: [check-pr-merge, retag-pr-image, quality]
    if: |
      always() && (
        needs.check-pr-merge.outputs.is_pr_merge == 'false' ||
        (needs.check-pr-merge.outputs.is_pr_merge == 'true' && needs.retag-pr-image.outputs.image_retagged != 'true')
      )
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Log fallback reason if retagging failed
        if: needs.check-pr-merge.outputs.is_pr_merge == 'true' && needs.retag-pr-image.outputs.image_retagged != 'true'
        run: |
          echo "⚠️ FALLBACK: Building new image because PR image retagging failed"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to container registry
        run: |
          az acr login --name play14containerregistry

      - name: Build and push production container image
        uses: docker/build-push-action@v6
        with:
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          file: ${{ env.WORKING_DIRECTORY }}/Dockerfile
          context: ${{ env.WORKING_DIRECTORY }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            STRAPI_API_URL=${{ env.STRAPI_API_URL }}
            STRAPI_API_SECRET=${{ secrets.STRAPI_API_SECRET }}
            NEXT_PUBLIC_MAPBOX_ACCESS_TOKEN=${{ secrets.NEXT_PUBLIC_MAPBOX_ACCESS_TOKEN }}

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [check-pr-merge, retag-pr-image, build-production]
    if: always() && (needs.retag-pr-image.result == 'success' || needs.build-production.result == 'success')
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Log deployment source
        run: |
          if [ "${{ needs.retag-pr-image.result }}" == "success" ]; then
            echo "🚀 Deploying retagged PR image (fast path)"
          elif [ "${{ needs.build-production.result }}" == "success" ]; then
            echo "🚀 Deploying newly built image"
          fi

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Production Container App
        uses: azure/CLI@v2
        with:
          inlineScript: |
            echo "Deploying image: $REGISTRY/$IMAGE_NAME:${{ github.sha }}"
            az containerapp update \
              -n "$CONTAINER_APP_NAME" \
              -g "$RESOURCE_GROUP" \
              --image "$REGISTRY/$IMAGE_NAME:${{ github.sha }}" \
              --set-env-vars \
                STRAPI_API_URL="$STRAPI_API_URL" \
                STRAPI_API_SECRET=secretref:strapi-api-secret \
                NEXT_PUBLIC_MAPBOX_ACCESS_TOKEN=secretref:mapbox-token

      - name: Get Container App URL
        id: get-url
        uses: azure/CLI@v2
        with:
          inlineScript: |
            URL=$(az containerapp show \
              -n "$CONTAINER_APP_NAME" \
              -g "$RESOURCE_GROUP" \
              --query properties.configuration.ingress.fqdn \
              -o tsv)
            echo "url=https://$URL" >> $GITHUB_OUTPUT

      - name: Wait for deployment to stabilize
        run: |
          echo "Waiting 30 seconds for deployment to stabilize..."
          sleep 30

      - name: Health check
        uses: azure/CLI@v2
        with:
          inlineScript: |
            URL="${{ steps.get-url.outputs.url }}"
            HEALTH_URL="$URL/api/health"
            MAX_ATTEMPTS=10
            SLEEP_SECONDS=10
            attempt=1

            echo "Checking health endpoint: $HEALTH_URL"
            echo "Will retry up to $MAX_ATTEMPTS times (${SLEEP_SECONDS}s intervals)"

            while [ $attempt -le $MAX_ATTEMPTS ]; do
              echo "Attempt $attempt/$MAX_ATTEMPTS..."

              HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -m 10 "$HEALTH_URL" || echo "000")

              if [ "$HTTP_CODE" = "204" ] || [ "$HTTP_CODE" = "200" ]; then
                echo "✅ Health check passed (HTTP $HTTP_CODE)"
                echo "🚀 Production deployment successful: $URL"
                exit 0
              fi

              echo "Health check failed (HTTP $HTTP_CODE). Waiting ${SLEEP_SECONDS}s..."
              sleep $SLEEP_SECONDS
              attempt=$((attempt + 1))
            done

            echo "❌ Health check failed after $MAX_ATTEMPTS attempts"
            exit 1

      - name: Create deployment summary
        if: always()
        run: |
          echo "## 🚀 Web Production Deployment" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** Production" >> $GITHUB_STEP_SUMMARY
          echo "**URL:** ${{ steps.get-url.outputs.url }}" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** \`$REGISTRY/$IMAGE_NAME:${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Backend:** $STRAPI_API_URL" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY

          if [ "${{ needs.retag-pr-image.result }}" == "success" ]; then
            echo "**Source:** Retagged PR #${{ needs.check-pr-merge.outputs.pr_number }} image" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.build-production.result }}" == "success" ]; then
            echo "**Source:** Newly built image" >> $GITHUB_STEP_SUMMARY
          fi
