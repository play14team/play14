name: Web Production Deployment

on:
  push:
    branches: [main]
    paths:
      - "packages/web/**"
      - "!packages/web/.github/**"
  workflow_dispatch:

concurrency:
  group: web-production
  cancel-in-progress: false

env:
  NODE_VERSION: "20"
  REGISTRY: play14containerregistry.azurecr.io
  IMAGE_NAME: play14/play14-web
  CONTAINER_APP_NAME: play14-ui
  RESOURCE_GROUP: play14-community
  WORKING_DIRECTORY: packages/web

jobs:
  build-and-push:
    name: Build and Push Production Image
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run linter
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: bun run lint

      - name: Type check
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: bun run typecheck

      - name: Build Next.js
        working-directory: ${{ env.WORKING_DIRECTORY }}
        env:
          STRAPI_API_URL: ${{ vars.STRAPI_API_URL }}
          STRAPI_API_SECRET: ${{ secrets.STRAPI_API_SECRET }}
          NEXT_PUBLIC_MAPBOX_ACCESS_TOKEN: ${{ secrets.NEXT_PUBLIC_MAPBOX_ACCESS_TOKEN }}
          NEXT_PUBLIC_URL: ${{ vars.NEXT_PUBLIC_URL }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: play14-web
          NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
          NEXT_PUBLIC_SENTRY_ENVIRONMENT: ${{ vars.SENTRY_ENVIRONMENT }}
        run: bun run build

      - name: Prepare Docker context for CI build
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: |
          # Remove .next from .dockerignore for CI builds (we need the pre-built output)
          sed -i '/^\.next$/d' .dockerignore
          sed -i '/^out$/d' .dockerignore

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to container registry
        run: |
          az acr login --name play14containerregistry

      - name: Build and push production container image
        uses: docker/build-push-action@v6
        with:
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          file: packages/web/Dockerfile.ci
          context: packages/web

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Production Container App
        uses: azure/CLI@v2
        with:
          inlineScript: |
            echo "Deploying image: $REGISTRY/$IMAGE_NAME:${{ github.sha }}"
            az containerapp update \
              -n "$CONTAINER_APP_NAME" \
              -g "$RESOURCE_GROUP" \
              --image "$REGISTRY/$IMAGE_NAME:${{ github.sha }}" \
              --set-env-vars \
                STRAPI_API_URL="${{ vars.STRAPI_API_URL }}" \
                STRAPI_API_SECRET=secretref:strapi-api-secret \
                NEXT_PUBLIC_MAPBOX_ACCESS_TOKEN=secretref:mapbox-token \
                NEXT_PUBLIC_SITE_URL="https://play14.org"

      - name: Get Container App URL
        id: get-url
        uses: azure/CLI@v2
        with:
          inlineScript: |
            URL=$(az containerapp show \
              -n "$CONTAINER_APP_NAME" \
              -g "$RESOURCE_GROUP" \
              --query properties.configuration.ingress.fqdn \
              -o tsv)
            echo "url=https://$URL" >> $GITHUB_OUTPUT

      - name: Wait for deployment to stabilize
        run: |
          echo "Waiting 30 seconds for deployment to stabilize..."
          sleep 30

      - name: Health check
        uses: azure/CLI@v2
        with:
          inlineScript: |
            URL="${{ steps.get-url.outputs.url }}"
            HEALTH_URL="$URL/api/health"
            MAX_ATTEMPTS=10
            SLEEP_SECONDS=10
            attempt=1

            echo "Checking health endpoint: $HEALTH_URL"
            echo "Will retry up to $MAX_ATTEMPTS times (${SLEEP_SECONDS}s intervals)"

            while [ $attempt -le $MAX_ATTEMPTS ]; do
              echo "Attempt $attempt/$MAX_ATTEMPTS..."

              HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -m 10 "$HEALTH_URL" || echo "000")

              if [ "$HTTP_CODE" = "204" ] || [ "$HTTP_CODE" = "200" ]; then
                echo "✅ Health check passed (HTTP $HTTP_CODE)"
                echo "🚀 Production deployment successful: $URL"
                exit 0
              fi

              echo "Health check failed (HTTP $HTTP_CODE). Waiting ${SLEEP_SECONDS}s..."
              sleep $SLEEP_SECONDS
              attempt=$((attempt + 1))
            done

            echo "❌ Health check failed after $MAX_ATTEMPTS attempts"
            exit 1

      - name: Create deployment summary
        if: always()
        run: |
          echo "## 🚀 Web Production Deployment" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** Production" >> $GITHUB_STEP_SUMMARY
          echo "**URL:** ${{ steps.get-url.outputs.url }}" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** \`$REGISTRY/$IMAGE_NAME:${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Backend:** ${{ vars.STRAPI_API_URL }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
