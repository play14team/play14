# Local development compose file for API package
# Run from packages/api directory: podman-compose up
# Note: Uses monorepo root as build context

services:
  play14-api:
    container_name: play14-api
    build:
      context: ../..
      dockerfile: packages/api/Dockerfile.dev
    image: play14-api:dev
    restart: unless-stopped
    env_file: .env
    environment:
      HOST: 0.0.0.0
      DATABASE_CLIENT: ${DATABASE_CLIENT}
      DATABASE_HOST: play14-db
      DATABASE_NAME: ${DATABASE_NAME}
      DATABASE_USERNAME: ${DATABASE_USERNAME}
      DATABASE_PORT: ${DATABASE_PORT}
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      NODE_ENV: ${NODE_ENV}
    volumes:
      - ./config:/app/packages/api/config
      - ./src:/app/packages/api/src
      - ./.env:/app/packages/api/.env
      - ./public/uploads:/app/packages/api/public/uploads
    ports:
      - "1337:1337"
      - "9000:9000"
    networks:
      - play14-api
    depends_on:
      - play14-db

  play14-db:
    container_name: play14-db
    platform: linux/arm64
    restart: unless-stopped
    env_file: .env
    image: docker.io/library/postgres:17.6-alpine
    environment:
      POSTGRES_USER: ${DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}
    volumes:
      - play14-data:/var/lib/postgresql/data/
    ports:
      - "5432:5432"
    networks:
      - play14-api

  pgadmin:
    container_name: pgadmin
    image: docker.io/dpage/pgadmin4:latest
    restart: unless-stopped
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@play14.org}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    networks:
      - play14-api
    depends_on:
      - play14-db

volumes:
  play14-data:
    external: true
  pgadmin-data:

networks:
  play14-api:
    name: play14-net
    driver: bridge
