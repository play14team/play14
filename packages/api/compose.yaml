services:
  play14-api:
    container_name: play14-api
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: play14-api:dev
    restart: unless-stopped
    env_file: .env
    environment:
      HOST: 0.0.0.0
      DATABASE_CLIENT: ${DATABASE_CLIENT}
      DATABASE_HOST: play14-db
      DATABASE_NAME: ${DATABASE_NAME}
      DATABASE_USERNAME: ${DATABASE_USERNAME}
      DATABASE_PORT: ${DATABASE_PORT}
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      NODE_ENV: ${NODE_ENV}
    volumes:
      - ./config:/opt/app/config
      - ./src:/opt/app/src
      - ./package.json:/opt/package.json
      - ./bun.lock:/opt/bun.lock

      - ./.env:/opt/app/.env
      - ./public/uploads:/opt/app/public/uploads
    ports:
      - "1337:1337"
    networks:
      - play14-api
    depends_on:
      - play14-db

  play14-db:
    container_name: play14-db
    platform: linux/arm64
    restart: unless-stopped
    env_file: .env
    image: docker.io/library/postgres:17.6-alpine
    environment:
      POSTGRES_USER: ${DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}
    volumes:
      - play14-api-data:/var/lib/postgresql/data/ #using a volume
      #- ./data:/var/lib/postgresql/data/ # if you want to use a bind folder

    ports:
      - "5432:5432"
    networks:
      - play14-api

  pgadmin:
    container_name: pgadmin
    image: docker.io/dpage/pgadmin4:latest
    restart: unless-stopped
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@play14.org}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    networks:
      - play14-api
    depends_on:
      - play14-db

volumes:
  play14-api-data:
  pgadmin-data:

networks:
  play14-api:
    name: play14-net
    driver: bridge
