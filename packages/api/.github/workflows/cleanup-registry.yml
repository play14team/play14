name: Cleanup Container Registry

on:
  schedule:
    # Run every Sunday at 02:00 UTC
    - cron: '0 2 * * 0'
  workflow_dispatch:

env:
  REGISTRY: play14containerregistry.azurecr.io
  REPOSITORY: play14/play14-api

jobs:
  cleanup:
    name: Cleanup Old Images
    runs-on: ubuntu-latest

    steps:
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.PLAY14API_AZURE_CREDENTIALS }}

      - name: Cleanup old production images
        uses: azure/CLI@v2
        with:
          inlineScript: |
            echo "Fetching production images (excluding 'latest' and 'pr-*' tags)..."

            # Get all tags excluding 'latest' and PR tags, sorted by creation date
            PRODUCTION_TAGS=$(az acr repository show-tags \
              --name play14containerregistry \
              --repository ${{ env.REPOSITORY }} \
              --orderby time_desc \
              --output tsv \
              | grep -v '^latest$' \
              | grep -v '^pr-')

            # Count total production tags
            TOTAL_COUNT=$(echo "$PRODUCTION_TAGS" | wc -l)
            echo "Total production images: $TOTAL_COUNT"

            if [ "$TOTAL_COUNT" -le 5 ]; then
              echo "5 or fewer production images exist. Nothing to delete."
            else
              # Skip first 5, delete the rest
              TAGS_TO_DELETE=$(echo "$PRODUCTION_TAGS" | tail -n +6)
              DELETE_COUNT=$(echo "$TAGS_TO_DELETE" | wc -l)
              echo "Deleting $DELETE_COUNT old production images..."

              echo "$TAGS_TO_DELETE" | while read -r tag; do
                if [ -n "$tag" ]; then
                  echo "Deleting production image: $tag"
                  az acr repository delete \
                    --name play14containerregistry \
                    --image ${{ env.REPOSITORY }}:$tag \
                    --yes
                fi
              done

              echo "Production cleanup completed. Kept 5 most recent images."
            fi

      - name: Cleanup old PR images
        uses: azure/CLI@v2
        with:
          inlineScript: |
            echo "Fetching PR images (tags starting with 'pr-')..."

            # Get all PR tags, sorted by creation date
            PR_TAGS=$(az acr repository show-tags \
              --name play14containerregistry \
              --repository ${{ env.REPOSITORY }} \
              --orderby time_desc \
              --output tsv \
              | grep '^pr-')

            # Count total PR tags
            TOTAL_COUNT=$(echo "$PR_TAGS" | wc -l)
            echo "Total PR images: $TOTAL_COUNT"

            if [ "$TOTAL_COUNT" -le 5 ]; then
              echo "5 or fewer PR images exist. Nothing to delete."
            else
              # Skip first 5, delete the rest
              TAGS_TO_DELETE=$(echo "$PR_TAGS" | tail -n +6)
              DELETE_COUNT=$(echo "$TAGS_TO_DELETE" | wc -l)
              echo "Deleting $DELETE_COUNT old PR images..."

              echo "$TAGS_TO_DELETE" | while read -r tag; do
                if [ -n "$tag" ]; then
                  echo "Deleting PR image: $tag"
                  az acr repository delete \
                    --name play14containerregistry \
                    --image ${{ env.REPOSITORY }}:$tag \
                    --yes
                fi
              done

              echo "PR cleanup completed. Kept 5 most recent images."
            fi

      - name: Cleanup summary
        uses: azure/CLI@v2
        with:
          inlineScript: |
            echo "=== Cleanup Summary ==="

            PRODUCTION_COUNT=$(az acr repository show-tags \
              --name play14containerregistry \
              --repository ${{ env.REPOSITORY }} \
              --output tsv \
              | grep -v '^latest$' \
              | grep -v '^pr-' \
              | wc -l)

            PR_COUNT=$(az acr repository show-tags \
              --name play14containerregistry \
              --repository ${{ env.REPOSITORY }} \
              --output tsv \
              | grep '^pr-' \
              | wc -l)

            echo "Remaining production images: $PRODUCTION_COUNT"
            echo "Remaining PR images: $PR_COUNT"
            echo "Latest tag: preserved"
