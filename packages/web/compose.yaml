# Local development compose file for Web package
# Run from packages/web directory: podman-compose up
# Note: Uses monorepo root as build context

services:
  app:
    container_name: play14-web
    build:
      context: ../..
      dockerfile: packages/web/Dockerfile.dev
      target: development
      cache_from:
        - type=registry,ref=play14containerregistry.azurecr.io/play14/play14-web:dev-cache
      cache_to:
        - type=inline
    env_file:
      - .env.local
    ports:
      - "3000:3000"
    volumes:
      # Mount source code for hot reload
      - ./src:/app/packages/web/src:z
      - ./public:/app/packages/web/public:z
      - ./next.config.js:/app/packages/web/next.config.js:z
      - ./tsconfig.json:/app/packages/web/tsconfig.json:z
      - ./.prettierrc:/app/packages/web/.prettierrc:z
      - ./eslint.config.mjs:/app/packages/web/eslint.config.mjs:z
      # Preserve node_modules in container
      - node_modules:/app/node_modules
    environment:
      - NODE_ENV=development
      - STRAPI_API_URL=http://play14-api:1337
    command: bun run develop
    networks:
      - Play14-api
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:3000",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  node_modules:

networks:
  Play14-api:
    external: true
